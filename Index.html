ντικείμενο\"},{\"kind\":\"li\",\"text\":\"Άδεια ασκήσεως επαγγέλματος\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"li\",\"text\":\"Γνώση Διεθνών λογιστικών προτύπων (IAS)\"},{\"kind\":\"li\",\"text\":\"Δυνατότητα μετακινήσεων εκτός Ελλάδας\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος θεωρείται επιπλέον προσόν (MSC, MBA)\"},{\"kind\":\"li\",\"text\":\"Εκπληρωμένες στρατιωτικές υποχρεώσεις\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 10 - 12 χρόνια σε διαφορετικά τμήματα της οικονομικής διεύθυνσης, εκ των οποίων τουλάχιστον 5 έτη σε προϊσταμενική θέση οικονομικού τμήματος εταιρείας\"}],\"children\":[15,16],\"depth\":3},{\"id\":\"r15\",\"dept\":\"Διευθυνση Λειτουργιων & Οικονομικων Υπηρεσιων\",\"title\":\"Planning & Budget Controller\",\"short\":\"Planning & Budget Controller\",\"reportsTo\":\"Οικονομικο Διευθυντη\",\"parent\":14,\"virtual\":true,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"p\",\"text\":\"Δεν περιλαμβανεται αναλυτικη περιγραφη για αυτον τον ρολο στον Οδηγο Περιγραφης Αρμοδιοτητων.\"}],\"children\":[],\"depth\":4},{\"id\":\"r16\",\"dept\":\"Διεύθυνση Λειτουργιών & Οικονομικών Υπηρεσιών\",\"title\":\"Accounting & Tax Controller\",\"short\":\"Accounting & Tax Controller\",\"reportsTo\":\"Finance Manager\",\"parent\":14,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Είναι υπεύθυνος για την τήρηση ακριβούς και έγκαιρης λογιστικής και φορολογικής εικόνας της εταιρείας, μέσω της καθημερινής, μηνιαίας και ετήσιας εκτέλεσης των λογιστικών και φοροτεχνικών διαδικασιών.\"},{\"kind\":\"h\",\"text\":\"Θέση που αναφέρεται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"-\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"p\",\"text\":\"Σε ημερήσια βάση:\"},{\"kind\":\"li\",\"text\":\"Καταχωρεί στη λογιστική τις καθημερινές αγορές, δαπάνες, εισπράξεις και πληρωμές της εταιρείας, διασφαλίζοντας ότι κάθε συναλλαγή αντιστοιχίζεται στον σωστό λογαριασμό\"},{\"kind\":\"li\",\"text\":\"Συμφωνεί καθημερινά τις κινήσεις των τραπεζικών λογαριασμών και καρτών με τις λογιστικές εγγραφές, ώστε να εντοπίζονται άμεσα τυχόν αποκλίσεις\"},{\"kind\":\"li\",\"text\":\"Αποστέλλει στο MyData της ΑΑΔΕ τα παραστατικά εσόδων, αγορών, δαπανών και παγίων, ώστε τα ηλεκτρονικά βιβλία να παραμένουν ενήμερα σε πραγματικό χρόνο\"},{\"kind\":\"li\",\"text\":\"Αναθέτει εργασίες και συντονίζει την ομάδα Αγορών (Purchasing)\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει και εκδίδει το αρχείο πληρωμών (τακτικών και έκτακτων) που θα εκτελεστεί, και παρακολουθεί ότι κάθε πληρωμή πραγματοποιείται σύμφωνα με το εγκεκριμένο πρόγραμμα\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται το εισπρακτικό, παρακολουθώντας ποιοι πελάτες οφείλουν και προωθώντας τις απαραίτητες ενέργειες είσπραξης\"},{\"kind\":\"li\",\"text\":\"Χαρακτηρίζει σωστά τα έσοδα και τα έξοδα στο MyData ανά κατηγορία, ώστε να είναι έγκυρα για τη φορολογική δήλωση\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί την τήρηση των συμφωνητικών με προμηθευτές και εργολάβους, ελέγχοντας ότι οι όροι τιμολόγησης εφαρμόζονται σωστά\"},{\"kind\":\"li\",\"text\":\"Καταχωρεί νέα πάγια στοιχεία τόσο στη λογιστική όσο και στο ξεχωριστό Μητρώο Παγίων, ώστε οι δύο πηγές να παραμένουν συγχρονισμένες\"},{\"kind\":\"li\",\"text\":\"Εκδίδει πιστωτικά τιμολόγια ΦΠΑ όπου απαιτείται και συμφωνεί τα υπόλοιπα με πελάτες και προμηθευτές για την αποφυγή διαφορών\"},{\"kind\":\"li\",\"text\":\"Ελέγχει τις οδηγίες τιμολόγησης (invoice instructions) πριν την έκδοση κάθε παραστατικού και προετοιμάζει το ίδιο το τιμολόγιο\"},{\"kind\":\"li\",\"text\":\"Εκδίδει proforma invoice όταν χρειάζεται είσπραξη προκαταβολής από πελάτη πριν την τελική τιμολόγηση\"},{\"kind\":\"li\",\"text\":\"Συμπληρώνει τα απαραίτητα έντυπα και επικοινωνεί με την τράπεζα για την έκδοση εγγυητικών επιστολών, όποτε ζητηθεί\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις απαλλαγές ΦΠΑ που ισχύουν για συγκεκριμένες συναλλαγές, ώστε να εφαρμόζονται σωστά\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί εσωτερικά με το προσωπικό για τη συλλογή αποδείξεων/τιμολογίων δαπανών (π.χ. κάρτες, μετρητά)\"},{\"kind\":\"li\",\"text\":\"Διατηρεί την επικοινωνία με τον εξωτερικό λογιστή, τις τράπεζες και λοιπούς τρίτους συνεργάτες για τρέχοντα θέματα\"},{\"kind\":\"li\",\"text\":\"Αρχειοθετεί όλα τα λογιστικά παραστατικά με τρόπο που να επιτρέπει εύκολη ανάκτηση σε μελλοντικό έλεγχο\"},{\"kind\":\"p\",\"text\":\"Σε μηνιαία βάση (κλείσιμο μήνα):\"},{\"kind\":\"li\",\"text\":\"Ελέγχει ότι όλα τα παραστατικά του μήνα έχουν καταχωρηθεί σωστά στο MyData, και επικοινωνεί με προμηθευτές όταν εντοπίζει ελλείποντα ή λανθασμένα παραστατικά στην πλατφόρμα\"},{\"kind\":\"li\",\"text\":\"Συμφωνεί τους δανειακούς λογαριασμούς, τους λογαριασμούς όψεως και τις κάρτες τραπεζών με τα αντίστοιχα λογιστικά υπόλοιπα\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει τους ανακεφαλαιωτικούς πίνακες αποκτήσεων/λήψης υπηρεσιών και παραδόσεων/παροχής υπηρεσιών που απαιτούνται για τη δήλωση ΦΠΑ, και συμπληρώνει το φύλλο ελέγχου ισοζυγίου μήνα\"},{\"kind\":\"li\",\"text\":\"Συμφωνεί την περιοδική δήλωση ΦΠΑ των βιβλίων με τα δεδομένα του MyData, εντοπίζοντας και επιλύοντας τυχόν αποκλίσεις μεταξύ των δύο πηγών\"},{\"kind\":\"li\",\"text\":\"Ελέγχει και κλείνει τους λογαριασμούς παρακρατούμενων φόρων, ασφαλιστικών ταμείων και αποδοχών πληρωτέων, διασφαλίζοντας ότι είναι έτοιμοι για δήλωση\"},{\"kind\":\"li\",\"text\":\"Συμφωνεί το άρθρο μισθοδοσίας της λογιστικής με τα επίσημα έντυπα ΑΠΔ και ΦΜΥ, ώστε να μην υπάρχει απόκλιση ανάμεσα σε λογιστική και μισθοδοσία\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις προθεσμίες δηλώσεων και πληρωμών φόρων του μήνα, ώστε καμία να μη χαθεί\"},{\"kind\":\"p\",\"text\":\"Σε ετήσια βάση (κλείσιμο έτους):\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει τις οικονομικές καταστάσεις της χρήσης\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει τον φάκελο φορολογικού ελέγχου και ανταποκρίνεται σε τυχόν ελέγχους της ΑΑΔΕ\"},{\"kind\":\"li\",\"text\":\"Ελέγχει και συμφωνεί την ετήσια απογραφή αποθήκης και το ετήσιο Μητρώο Παγίων με τα λογιστικά βιβλία\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει τους εξωτερικούς ορκωτούς ελεγκτές κατά τον ετήσιο έλεγχο, παρέχοντας τα απαραίτητα στοιχεία\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με Διευθυντή Λειτουργίας και Οικονομικής Διαχείρισης και τον Γενικό διευθυντή\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την πρόοδο του μηνιαίου και ετήσιου λογιστικού κλεισίματος, καθώς και για τυχόν εκκρεμότητες ή αποκλίσεις (π.χ. διαφορές ανάμεσα σε MyData και δηλωμένη ΦΠΑ)\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει τις εγκριτικές ροές και τις προτεραιότητες πληρωμών πριν από την εκτέλεση του μηνιαίου αρχείου πληρωμών\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει άμεσα για κρίσιμα φορολογικά ζητήματα, όπως επικείμενος έλεγχος της ΑΑΔΕ ή προθεσμία που κινδυνεύει να χαθεί\"},{\"kind\":\"li\",\"text\":\"Παρέχει τα λογιστικά στοιχεία που χρειάζεται ο Finance Manager για την κατάρτιση του P&L, του Ισολογισμού και του ετήσιου προϋπολογισμού\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα και εξωτερικούς συνεργάτες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Commercial Follow up για την τιμολόγηση παραγγελιών και την παρακολούθηση εισπράξεων από πελάτες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τις Προμήθειες για τη συμφωνία υπολοίπων προμηθευτών και την επαλήθευση όρων σε συμφωνητικά/εργολαβικά\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με την Αποθήκη για τη συμφωνία της ετήσιας απογραφής με το Μητρώο Παγίων και τα λογιστικά βιβλία\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον εξωτερικό λογιστή, τις τράπεζες και τους ορκωτούς ελεγκτές για τρέχοντα λογιστικά και φορολογικά θέματα\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος\"},{\"kind\":\"li\",\"text\":\"Λογιστική καταχώριση και συμφωνία λογαριασμών (τράπεζες, πελάτες, προμηθευτές, πάγια)\"},{\"kind\":\"li\",\"text\":\"Προετοιμασία φορολογικών δηλώσεων, Ανακεφαλαιωτικών Πινάκων (VIES) και φακέλων φορολογικού ελέγχου\"},{\"kind\":\"li\",\"text\":\"Έκδοση τιμολογίων, proforma invoice και εγγυητικών επιστολών σε συνεννόηση με τράπεζες\"},{\"kind\":\"li\",\"text\":\"Ακρίβεια και τήρηση αυστηρών νομικών προθεσμιών\"},{\"kind\":\"li\",\"text\":\"Προσαρμοστικότητα σε αλλαγές φορολογικής/λογιστικής νομοθεσίας\"},{\"kind\":\"li\",\"text\":\"Διαχείριση πολλαπλών παράλληλων λογιστικών κύκλων (ημερήσιο, μηνιαίο, ετήσιο) ταυτόχρονα\"},{\"kind\":\"li\",\"text\":\"Σαφής επικοινωνία οικονομικών/φορολογικών στοιχείων\"},{\"kind\":\"li\",\"text\":\"Εντοπισμός και επίλυση αποκλίσεων μεταξύ πηγών δεδομένων (π.χ. MyData έναντι λογιστικών βιβλίων)\"},{\"kind\":\"li\",\"text\":\"Γνώση ελληνικής φορολογικής νομοθεσίας (ΦΠΑ, ΦΜΥ, παρακρατούμενοι φόροι) και των σχετικών διαδικασιών δήλωσης\"},{\"kind\":\"li\",\"text\":\"Γνώση λογιστικών προτύπων και διαδικασιών μηνιαίου και ετήσιου κλεισίματος\"},{\"kind\":\"li\",\"text\":\"Γνώση της πλατφόρμας MyData και των απαιτήσεων ηλεκτρονικής τιμολόγησης/βιβλίων\"},{\"kind\":\"li\",\"text\":\"Γνώση διαδικασιών διαχείρισης παγίων και τήρησης Μητρώου Παγίων\"},{\"kind\":\"li\",\"text\":\"Μεθοδικότητα και προσοχή στη λεπτομέρεια\"},{\"kind\":\"li\",\"text\":\"Αξιοπιστία και εχεμύθεια\"},{\"kind\":\"li\",\"text\":\"Συνέπεια σε επαναλαμβανόμενες, αυστηρά προθεσμιακές διαδικασίες\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Μηνιαία αναφορά ΦΠΑ και ΦΜΥ\",\"Accounting & Tax Controller\",\"Οικ. Δ/ντη (Finance Manager)\",\"Μηνιαία\"],[\"Ετήσιες οικονομικές καταστάσεις και φάκελος φορολογικού ελέγχου\",\"Accounting & Tax Controller\",\"Οικ. Δ/ντη (Finance Manager)\",\"Μηνιαία\"],[\"Αναφορές που δέχεται\"],[\"Παραστατικά δαπανών προς καταχώριση\",\"Όλα τα τμήματα\",\"Accounting & Tax Controller\",\"Τακτικά\"],[\"Στοιχεία μισθοδοσίας (ΑΠΔ, ΦΜΥ)\",\"HR Operations Specialist\",\"Accounting & Tax Controller\",\"Μηνιαία\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Μηνιαίο Κλείσιμο & Συμφωνία ΦΠΑ\",\"Finance Manager, Λογιστές\",\"Μηνιαίο\",\"Επισκόπηση αποκλίσεων MyData, έγκριση δήλωσης ΦΠΑ\"],[\"Ετήσιος Φορολογικός Έλεγχο\",\"Finance Manager, Εξωτερικοί Ελεγκτές\",\"Ετήσιο\",\"Προετοιμασία φακέλου ελέγχου, ανταπόκριση σε ΑΑΔΕ\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"ERP\"},{\"kind\":\"li\",\"text\":\"MyData (πλατφόρμα ΑΑΔΕ)\"},{\"kind\":\"li\",\"text\":\"MS Office (Word, Excel, PowerPoint, Outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο ΑΕΙ/ΤΕΙ Λογιστικής, Οικονομικών ή συναφούς αντικειμένου\"},{\"kind\":\"li\",\"text\":\"Επαγγελματική Ταυτότητα Λογιστή Φοροτεχνικού (ΟΕΕ), κατηγορίας ανάλογης με την τάξη βιβλίων της εταιρείας\"},{\"kind\":\"li\",\"text\":\"Καλή γνώση Η/Υ (MS Office, ERP, MyData)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Τήρηση Προθεσμιών Φορολογικών Δηλώσεων (ΦΠΑ/ΦΜΥ)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Ασυμφωνιών MyData (Reconciliation Exception Rate)\"},{\"kind\":\"li\",\"text\":\"Χρόνος Ολοκλήρωσης Μηνιαίου Κλεισίματος (Days to Close Time)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5+ ετών σε λογιστήριο/φοροτεχνικές εργασίες, εκ των οποίων 2-3 σε εποπτική θέση\"},{\"kind\":\"p\",\"text\":\"6.3.3.2 Planning Budget & Controller\"},{\"kind\":\"h\",\"text\":\"Τίτλος Ρόλου: Planning Budget & Controller\"},{\"kind\":\"h\",\"text\":\"Αναφέρεται στοv: Finance Manager\"},{\"kind\":\"h\",\"text\":\"Θέση που αναφέρεται στην παρούσα θέση: -\"},{\"kind\":\"h\",\"text\":\"Σκοπός του ρόλου: Είναι υπεύθυνος για την υποστήριξη της κατάρτισης, παρακολούθησης και ανάλυσης του προϋπολογισμού της εταιρείας, εντοπίζοντας αποκλίσεις μεταξύ πραγματικών και προϋπολογισμένων μεγεθών και παρέχοντας δεδομένα για τη λήψη οικονομικών αποφάσεων.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει την κατάρτιση του ετήσιου προϋπολογισμού, συγκεντρώνοντας ιστορικά δεδομένα και προβλέψεις εσόδων\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τα πραγματικά έξοδα και έσοδα σε σχέση με τον εγκεκριμένο προϋπολογισμό ανά τμήμα, εντοπίζοντας αποκλίσεις\"},{\"kind\":\"li\",\"text\":\"Διερευνά τις αιτίες σημαντικών αποκλίσεων και ενημερώνει τον Finance Manager\"},{\"kind\":\"li\",\"text\":\"Συντάσσει τακτικές αναφορές κατάστασης προϋπολογισμού και ανάλυση αποκλίσεων\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στη διαδικασία χρηματοοικονομικής πρόβλεψης, ενημερώνοντας τα μοντέλα με βάση τα πραγματικά αποτελέσματα\"},{\"kind\":\"li\",\"text\":\"Συντηρεί και ενημερώνει πολύπλοκα υπολογιστικά φύλλα για μηνιαία αποτελέσματα και μακροπρόθεσμο σχεδιασμό\"},{\"kind\":\"li\",\"text\":\"Συλλέγει και επεξεργάζεται στατιστικά δεδομένα για ειδικές αναφορές διοίκησης\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει την προετοιμασία στοιχείων για τον ετήσιο ανεξάρτητο έλεγχο\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Finance Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για την πρόοδο κατάρτισης προϋπολογισμού και τυχόν σημαντικές αποκλίσεις\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει κατεύθυνση για προτεραιότητες ανάλυσης\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τους προϊσταμένους τμημάτων για τη συλλογή στοιχείων προϋπολογισμού και την επίλυση αποριών σχετικά με δαπάνες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Accounting & Tax Controller για τα πραγματικά οικονομικά δεδομένα\"},{\"kind\":\"h\",\"text\":\"Δεξιό κών συστημάτων της εταιρείας.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται και συντηρεί όλα τα πληροφοριακά συστήματα της εταιρείας (π.χ. ERP)\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται δικαιώματα χρηστών, ρόλους και ρυθμίσεις ασφαλείας σε κάθε πληροφοριακό σύστημα\"},{\"kind\":\"li\",\"text\":\"Διερευνά και επιλύει τεχνικά και λειτουργικά ζητήματα των πληροφοριακών συστημάτων σε συνεργασία με εξωτερικούς παρόχους όπου απαιτείται\"},{\"kind\":\"li\",\"text\":\"Συντονίζει αναβαθμίσεις, ενημερώσεις και βελτιώσεις των πληροφοριακών συστημάτων\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τη γενική τεχνολογική υποδομή της εταιρείας (δίκτυο, servers, ασφάλεια συστημάτων, hardware/software)\"},{\"kind\":\"li\",\"text\":\"Σχεδιάζει και υλοποιεί λύσεις αυτοματοποίησης επιχειρησιακών διαδικασιών (π.χ. ροές εργασίας, ενσωματώσεις συστημάτων)\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει την ενσωμάτωση συστημάτων παραγωγής (π.χ. barcode/σάρωση) με κάθε πληροφοριακό σύστημα όπου εφαρμόζεται\"},{\"kind\":\"li\",\"text\":\"Διοικεί και καθοδηγεί τον IT Specialist\"},{\"kind\":\"li\",\"text\":\"Εκπαιδεύει το προσωπικό στη χρήση συστημάτων και εργαλείων\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει τη συμμόρφωση με πολιτικές ασφάλειας δεδομένων και κυβερνοασφάλειας\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Operations Director\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για την κατάσταση συστημάτων, έργα αυτοματοποίησης και τεχνολογικές ανάγκες\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει προτεραιότητες και προϋπολογισμό για επενδύσεις σε τεχνολογία\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με όλα τα τμήματα για την υποστήριξη και βελτίωση της χρήσης των πληροφοριακών συστημάτων\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εξωτερικούς παρόχους λογισμικού και υποδομής\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με το Λογιστήριο/Finance Manager για τις οικονομικές λειτ \"p\",\"text\":\"Warehouse Operator, Forklift Driver, 2nd Forklift Driver, Warehouse Receivables & Deliverables\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Διοικεί και κατανέμει τις εργασίες της ομάδας αποθήκης (Warehouse Operator, Forklift Drivers, Warehouse Receivables & Deliverables)\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τους διαθέσιμους χώρους (εντός και εκτός αποθήκης) με χωροταξική οργάνωση και ευταξία\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τα επίπεδα αποθεμάτων μέσω του ERP και εντοπίζει ανάγκη, άμεση ή δυνητική, για αναπλήρωση με εξωτερική παραγγελία\"},{\"kind\":\"li\",\"text\":\"Διαμορφώνει προτάσεις βελτιστοποίησης των διαδικασιών αποθήκευσης και μεταφορών\"},{\"kind\":\"li\",\"text\":\"Δημιουργεί αιτήματα αγοράς (PR) για αναπλήρωση αποθεμάτων όταν απαιτείται\"},{\"kind\":\"li\",\"text\":\"Επιβλέπει την παραλαβή υλικών κατά την άφιξη φορτίων: εκφόρτωση, παραλαβή του Δελτίου Αποστολής, ποσοτικός, οπτικός και όπου απαιτείται ποιοτικός έλεγχος\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται αποκλίσεις κατά την παραλαβή (λάθος ποσότητα, ποιότητα ή υλικό) και συντονίζεται με το τμήμα αγορών για τη διερεύνηση και επίλυσή τους\"},{\"kind\":\"li\",\"text\":\"Εφαρμόζει κανόνες ασφαλείας λόγω διακίνησης βαρέων μεταλλικών αντικειμένων και χρήσης μηχανημάτων (π.χ. κλαρκ)\"},{\"kind\":\"li\",\"text\":\"Επιβλέπει την τροφοδότηση της παραγωγής με υλικά ανά έργο\"},{\"kind\":\"li\",\"text\":\"Οργανώνει και επιβλέπει τις κυκλικές απογραφές αποθέματος\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί με τα ενδιαφερόμενα τμήματα για τον καλύτερο προγραμματισμό διάθεσης υλικών\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Operations Director\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την κατάσταση αποθεμάτων και τυχόν προβλήματα παραλαβών ή χωρητικότητας\"},{\"kind\":\"li\",\"text\":\"Παρέχει έγκαιρη ενημέρωση για κρίσιμα θέματα εφοδιασμού (ροή υλικών, πιθανές καθυστερήσεις, ανάγκες)\"},{\"kind\":\"li\",\"text\ :\"li\",\"text\":\"Κατευθύνει τη διοίκηση στις πολιτικές και πρακτικές ανθρώπινου δυναμικού\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται/διεξάγει προγράμματα εκπαίδευσης και προσανατολισμού εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τις διατάξεις των συμβάσεων εργασίας & εξωτερικών συνεργατών\"},{\"kind\":\"li\",\"text\":\"Εφαρμόζει αποτελεσματικά τον Κανονισμό Εργασίας και φροντίζει για την επικαιροποίηση του\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει την εφαρμογή/διαχείριση απολαβών-παροχών και συντονίζει τις ομάδες ευθύνης\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τη διοίκηση για τον εντοπισμό και τον σχεδιασμό των απαιτήσεων ανθρώπινου δυναμικού για την κάλυψη βραχυπρόθεσμων και μακροπρόθεσμων επιχειρηματικών αναγκών\"},{\"kind\":\"li\",\"text\":\"Είναι θεματοφύλακας της στοχοθεσίας του προσωπικού, παρακολουθώντας τους δείκτες προόδου των εργασιών (KPIs/objectives)\"},{\"kind\":\"li\",\"text\":\"Αναθέτει καθήκοντα, ελέγχει και παρακολουθεί τις ανατεθειμένες εργασίες της ομάδας ευθύνης (HR, payroll)\"},{\"kind\":\"li\",\"text\":\"Φροντίζει για τη έγκαιρη διευθέτηση των εργασιών του τομέα ευθύνης\"},{\"kind\":\"li\",\"text\":\"Παρέχει υποστήριξη στους επικεφαλής για τις αρμοδιότητες, την δομή και την οργάνωση των τμημάτων\"},{\"kind\":\"li\",\"text\":\"Έχει την ευθύνη όλου του κύκλου του εργαζομένου από την προσέλκυση (αναζήτηση ταλέντων), την πρόσληψη έως και την αποδέσμευση\"},{\"kind\":\"li\",\"text\":\"Διαμορφώνει πλάνο προσλήψεων εργαζομένων σύμφωνα με τακτικές και έκτακτες ανάγκες\"},{\"kind\":\"li\",\"text\":\"Παρακινεί, καθοδηγεί και εμψυχώνει τους ανθρώπους και συνδράμει στην διοργάνωση εταιρικών εκδηλώσεων για το προσωπικό\"},{\"kind\":\"li\",\"text\":\"Επιλύει ζητήματα παρανοήσεων ή συγκρούσεων που τυχόν προκύψουν\"},{\"kind\":\"li\",\"text\":\"Ελέγχει θέματα κόστους, εξόδων των εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται όλο το σύστημα καταγραφής υπερεργασίας, υπερωριών, αδειών και αιτήματα των εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει εκθέσεις ενημέρωσης της διοίκησης σχετικά με δείκτες διακράτησης, ικανοποίησης εργαζομένων κτλ.\"},{\"kind\":\"li\",\"text\":\"Ενημερώνεται συνεχώς για θέματα που αφορούν το αντικείμενο εργασίας (εργασιακά)\"},{\"kind\":\"li\",\"text\":\"Φροντίζει για τη διατήρηση καλού εργασιακού κλίματος\"},{\"kind\":\"li\",\"text\":\"Εκπροσωπεί την επιχείρηση στις δημόσιες αρχές\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με γενικό διευθυντή ή και άμεσο Υπεύθυνο\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται καθημερινά με το γενικό διευθυντή για τρέχοντα θέματα εργασιών\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει σε συνεργασία με τον Γ.Δ. & Δ.Λ. τον ετήσιο προϋπολογισμό κόστους (Payroll budget)\"},{\"kind\":\"li\",\"text\":\"Παρέχει έγκυρες και εντός χρονικών ορίων πληροφορίες για θέματα μείζονος σημασίας (σχέσεις εργαζομένων, θέματα ασφάλειας, υγιεινής κ.α.)\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει σε θεσμοθετημένες συσκέψεις διατηρώντας ουσιαστικό και κρίσιμο ρόλο\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται καθημερινά με τους προϊσταμένους τμημάτων (π.χ. τμήμα Ι.Τ., τμήμα προμηθειών, marketing κτλ. για θέματα που αφορούν τις προσβάσεις και τον εξοπλισμό των εργαζομένων)\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με εξωτερικούς συνεργάτες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με την ομάδα συμβούλων HR για την υλοποίηση και παρακολούθηση του τρέχοντος στρατηγικού πλάνου δράσης ή/και το σχεδιασμό άλλων ad hoc δράσεων\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με portals αγγελιών, πανεπιστημιακά ιδρύματα παροχής υποψήφιων αποφοίτων για εργασία κτλ.\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με συμβούλους HR, ιατροφαρμακευτικής κάλυψης, νομικών υπηρεσιών κτλ.\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Οργάνωση /προγραμματισμός και τήρηση χρονοδιαγραμμάτων\"},{\"kind\":\"li\",\"text\":\"Επικοινωνία και ε ριμηνιαία\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Μηνιαία Σύσκεψη Ανθρώπινου Δυναμικού\",\"Δ/ντες διευθύνσεων\",\"Μηνιαία\",\"Aνασκόπηση ωρών απασχόλησης/αδειών/ασθενειών, αξιολόγηση δεικτών, εντοπισμός θεμάτων εργασιακού κλίματος\"],[\"Σύσκεψη Στρατηγικού Σχεδιασμού HR\",\"Εξωτερική ομάδα συμβούλων HR\",\"Περιοδική\",\"Παρακολούθηση στρατηγικού πλάνου δράσης, σχεδιασμός ad hoc πρωτοβουλιών\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"ERP\"},{\"kind\":\"li\",\"text\":\"Εργάνη\"},{\"kind\":\"li\",\"text\":\"MS Office (word, excel, PowerPoint, outlook)\"},{\"kind\":\"li\",\"text\":\"Σύστημα HRIS εφόσον υπάρχει - συστήνεται\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Ανώτατης σχολής ή συναφές αντικείμενο\"},{\"kind\":\"li\",\"text\":\"Άδεια ασκήσεως επαγγέλματος\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος θεωρείται επιπλέον προσόν (MSC, MBA)\"},{\"kind\":\"li\",\"text\":\"Εκπληρωμένες στρατιωτικές υποχρεώσεις\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Αποχώρησης Προσωπικού (Employee Turnover Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Διακράτησης Προσωπικού (Employee Retention Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Διατήρησης Κρίσιμων Θέσεων (Retention Rate of Critical Roles)\"},{\"kind\":\"li\",\"text\":\"Δείκτης Εργασιακής Δέσμευσης Προσωπικού (Employee Engagement Index)\"},{\"kind\":\"li\",\"text\":\"Κόστος ανά Πρόσληψη (Cost per Hire)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 10+ χρόνια σε τομείς διαχείρισης Ανθρώπινου Δυναμικού σε βιομηχανία\"},{\"kind\":\"li\",\"text\":\"5-7 χρόνια σε προϊσταμενική θέση\"}],\"children\":[31],\"depth\":3},{\"id\":\"r31\",\"dept\":\"Διεύθυνση Λειτουργιών & Οικονομικών Υπηρεσιών\",\"title\":\"HR Operations Specialist\",\"short\":\"HR Operations Specialist\",\"reportsTo\":\"Υπεύθυνος Ανθρώπινου Δυναμικού (Manager)\",\"parent\":30,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την υποστήριξη των καθημερινών λειτουργιών Ανθρώπινου Δυναμικού, την τήρηση αρχείων προσωπικού, μισθοδοσία, άδειες, ένταξη νέων εργαζομένων, διασφαλίζοντας την ακρίβεια των δεδομένων και τη συμμόρφωση με την εργατική νομοθεσία.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Τηρεί και ενημερώνει τα αρχεία προσωπικού (προσλήψεις, μεταθέσεις, αλλαγές μισθού, αποχωρήσεις)\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει τη διαδικασία μισθοδοσίας σε συνεργασία με το Λογιστήριο\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται αιτήματα αδειών και απουσιών προσωπικού\"},{\"kind\":\"li\",\"text\":\"Οργανώνει και συντονίζει τη διαδικασία ένταξης (onboarding) νέων εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Απαντά σε ερωτήματα εργαζομένων σχετικά με πολιτικές HR, παροχές και διαδικασίες\"},{\"kind\":\"li\",\"text\":\"Τηρεί το σύστημα HRIS/ERP με ακριβή και ενημερωμένα δεδομένα εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει τη συμμόρφωση με την εργατική νομοθεσία και τις εσωτερικές πολιτικές\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει τακτικές αναφορές και δείκτες Ανθρώπινου Δυναμικού\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει διαδικασίες αξιολόγησης απόδοσης και εκπαίδευσης προσωπικού\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον HR Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για εκκρεμότητες και ζητήματα προσωπικού\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει κατεύθυνση για πολιτικές και προτεραιότητες\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Λογιστήριο για τη μισθοδοσία\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με όλα τα τμήματα για θέματα προσωπικού (άδειες, ελλείψεις προσωπικού, ένταξη νέων εργαζομένων)\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Επικοινωνία με εργαζομένους για ζητήματα ανθρώπινου δυναμικού\"},{\"kind\":\"li\",\"text\":\"Διαχείριση HRIS και τήρηση αρχείων προσωπικού\"},{\"kind\":\"li\",\"text\":\"Προσοχή στη λεπτομέρεια και εμπιστευτικότητα δεδομένων\"},{\"kind\":\"li\",\"text\":\"Διαχείριση πολλαπλών παράλληλων αιτημάτων\"},{\"kind\":\"li\",\"text\":\"Γνώση εργατικής νομοθεσίας και διαδικασιών μισθοδοσίας\"},{\"kind\":\"li\",\"text\":\"Γνώση διαδικασιών Ανθρώπινου Δυναμικού\"},{\"kind\":\"li\",\"text\":\"Προσαρμοστικότητα σε απρόβλεπτες ανάγκες προσωπικού και προσλήψεων\"},{\"kind\":\"li\",\"text\":\"Ακρίβεια, συνέπεια, μεθοδικότητα\"},{\"kind\":\"li\",\"text\":\"Οργάνωση και συνέπεια\"},{\"kind\":\"li\",\"text\":\"Εχεμύθεια και επαγγελματισμός\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Αναφορά κατάστασης προσωπικού\",\"Οικ. Δ/ντη σε συνεργασία με Γ.Δ.\",\"HR Manager\",\"Τακτικά\"],[\"Στοιχεία μισθοδοσίας (ΑΠΔ, ΦΜΥ)\",\"HR Operations Specialist\",\"Accounting & Tax Controller\",\"Εβδομαδιαία\"],[\"Αναφορά προόδου τρεχουσών προσλήψεων\",\"HR Operations Specialist\",\"HR Manager\",\"Εβδομαδιαία\"],[\"Αναφορές που δέχεται\"],[\"Αιτήματα εργαζομένων\",\"Όλα τα ενδιαφερόμενα τμήματα\",\"HR Operations Specialist\",\"Συνεχώς\"],[\"Αίτημα κάλυψης νέας θέσης\",\"Προϊστάμενοι τμημάτων σε συνεργασία με Διευθύνσεις\",\"HR Operations Specialist\",\"Κατά περίπτωση\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Συνέντευξη Υποψηφίου\",\"Προϊστάμεν ιότητα/περιβάλλον/ασφάλεια/ISO, και σχεδιασμό για πωλήσεις, παραγωγή και τεχνικό σχεδιασμό, διασφαλίζοντας ότι τα προϊόντα της εταιρείας πληρούν τις τεχνικές, κανονιστικές και ποιοτικές απαιτήσεις, ενώ υποστηρίζουν τους αναπτυξιακούς στόχους.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Engineering Manager, Design Manager, Head of Quality Assurance, Environmental Health & Safety & ISO.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Καθορίζει τη στρατηγική κατεύθυνση της τεχνικής λειτουργίας σε ευθυγράμμιση με τους επιχειρηματικούς στόχους της εταιρείας\"},{\"kind\":\"li\",\"text\":\"Εποπτεύει τα τμήματα της τεχνικής λειτουργίας για θέματα έρευνας και ανάπτυξης, τεχνικών μελετών, προδιαγραφών, πιστοποιήσεων προϊόντων και ποιότητας και ασφάλειας\"},{\"kind\":\"li\",\"text\":\"Εγκρίνει νέες τεχνικές προδιαγραφές και μεθόδους πριν την εφαρμογή τους στην παραγωγή\"},{\"kind\":\"li\",\"text\":\"Εγκρίνει τον ετήσιο προϋπολογισμό και τις προτεραιότητες για την έρευνα και ανάπτυξη\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις τεχνολογικές εξελίξεις του κλάδου και εντοπίζει ευκαιρίες καινοτομίας\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει τη συμμόρφωση των προϊόντων με τα απαιτούμενα πρότυπα και πιστοποιήσεις (π.χ. ASME, TEMA, ISO)\"},{\"kind\":\"li\",\"text\":\"Εκπροσωπεί την εταιρεία σε τεχνικά ζητήματα προς πελάτες, φορείς πιστοποίησης και επιθεωρητές, όπου απαιτείται\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τη Διοίκηση για τον στρατηγικό σχεδιασμό νέων προϊόντων και επενδύσεων σε τεχνολογία\"},{\"kind\":\"li\",\"text\":\"Επιλύει κρίσιμα τεχνικά ζητήματα που ξεπερνούν το επίπεδο των υπεύθυνων των τεχνικών τμημάτων\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Γενικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την τεχνική στρατηγική, τους κινδύνους συμμόρφωσης και τις επενδυτικές ανάγκες\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στη διαμόρφωση ":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την εκπόνηση μηχανολογικών υπολογισμών και τεχνικών προδιαγραφών για την κατασκευή εναλλακτών θερμότητας και δοχείων πίεσης, διασφαλίζοντας τη συμμόρφωση με τα πρότυπα κατασκευής και τις απαιτήσεις κάθε παραγγελίας.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"-\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Εκπονεί μηχανολογικούς υπολογισμούς δοχείων πίεσης και σωληνώσεων και σύμφωνα με τα πρότυπα EN 13445, EN 13480, ASME B31.3 και API 660, πέραν του ASME BPVC\"},{\"kind\":\"li\",\"text\":\"Συντάσσει WPQR, WQR και WPS (έγγραφα πιστοποίησης μεθόδων και διαδικασιών συγκόλλησης) σύμφωνα με ASME Section IX, ISO 15614, ISO 9606 και ISO 1560\"},{\"kind\":\"li\",\"text\":\"Αξιοποιεί τα δεδομένα R&D για τους υπολογισμούς μηχανικής αντοχής\"},{\"kind\":\"li\",\"text\":\"Επιλέγει υλικά κατασκευής βάσει συνθηκών λειτουργίας (πίεση, θερμοκρασία, διάβρωση)\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει πλήρεις φακέλους σχεδιασμού, συμπεριλαμβανομένων υπολογισμών, οδηγιών επιθεώρησης και χαρτών συγκολλήσεων\"},{\"kind\":\"li\",\"text\":\"Ελέγχει και εγκρίνει σχέδια κατασκευής για συμμόρφωση με κώδικες και ακρίβεια\"},{\"kind\":\"li\",\"text\":\"Επανεξετάζει και καταρτίζει τεχνικούς φακέλους εξοπλισμού πίεσης ανά κατηγορία (I, II, III, IV) σύμφωνα με την Οδηγία PED 2014/68/ΕΕ\"},{\"kind\":\"li\",\"text\":\"Παρέχει τεχνική υποστήριξη σε Πωλήσεις και Παραγωγή σχετικά με προδιαγραφές παραγγελιών\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει σε εσωτερικές επιθεωρήσεις, δοκιμές πίεσης και Factory Acceptance Tests (FATs), σύμφωνα με πρότυπα ή διαδικασίες πελατών\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις προτύπων και κωδίκων και ενημερώνει τις πρακτικές του τμήματος αναλόγως\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Design Manager για τη μεταφορά υπολογισμών σε σχέδια\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Engineering Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για την πρόοδο τεχνικών μελετών ανά παραγγελία\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει προτεραιότητες μελετών\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Design Manager για τη μεταφορά υπολογισμών σε σχέδια\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Costing & Preparation Assistant για τεχνικά δεδομένα κοστολόγησης\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με την Παραγωγή για την επίλυση τεχνικών ζητημάτων κατασκευή\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον R&D Engineer για τη λήψη δεδομένων θερμικού σχεδιασμού που χρησιμοποιεί ως είσοδο στους υπολογισμούς μηχανικής αντοχής\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος\"},{\"kind\":\"li\",\"text\":\"Μηχανολογικοί υπολογισμοί αντοχής για την εκπόνηση μηχανολογικών υπολογισμών\"},{\"kind\":\"li\",\"text\":\"Τεχνική τεκμηρίωση\"},{\"kind\":\"li\",\"text\":\"Ακρίβεια σε σύνθετους υπολογισμούς\"},{\"kind\":\"li\",\"text\":\"Σαφής τεχνική επικοινωνία προς παραγωγή και πιστοποιήσεις\"},{\"kind\":\"li\",\"text\":\"Επίλυση τεχνικών προβλημάτων\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση ASME Section VIII, TEMA και σχετικών προτύπων καθώς και EN 13445, EN 13480, ASME B31.3 και API 660\"},{\"kind\":\"li\",\"text\":\"Γνώση της Οδηγίας PED 2014/68/ΕΕ και της κατηγοριοποίησης εξοπλισμού πίεσης (Κατηγορίες I-IV)\"},{\"kind\":\"li\",\"text\":\"Γνώση επιλογής και αντοχής υλικών\"},{\"kind\":\"li\",\"text\":\"Μεθοδικότητα και προσοχή στη λεπτομέρεια\"},{\"kind\":\"li\",\"text\":\"Συνέπεια στη συμμόρφωση με πρότυπα\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Φάκελος τεχνικής μελέτης ανά παραγγελία\",\"Technical Studies & Specs Engineer\",\"Engineering Manager\",\"Ανά παραγγελία\"],[\"Τεχνικό αρχείο οδηγίας εξοπλισμού υπό πίεση (PED)\",\"Technical Studies & Specs Engineer\",\"Product Certifications Engineer\",\"Ανά παραγγελία\"]]},{\"kind\":\"table\",\"head\":[\"Αναφορές που δέχεται\"],\"body\":[[\"Προδιαγραφές πελάτη\",\"Εμπορικό Τμήμα\",\"Technical Studies & Specs Engineer\",\"Ανά παραγγελία\"],[\"Πρόγραμμα Factory Acceptance Test (FAT)\",\"Head of A&T&P&P\",\"Technical Studies & Specs Engineer\",\"Ανά έργο\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Σύσκεψη Προδιαγραφών Συγκόλλησης (WPS)\",\"Technical Studies & Specs Engineer, Head of Steel Construction\",\"Κατά περίπτωση\",\"Καθορισμός και έγκριση WPS/WPQR πριν την εφαρμογή τους στην παραγωγή\"],[\"Σύσκεψη Ελέγχου Σχεδίων\",\"Technical Studies & Specs Engineer, Production Designer\",\"Κατά περίπτωση\",\"Επιβεβαίωση συμμόρφωσης κατασκευαστικών σχεδίων με ASME/PED πριν εφαρμογή τους στην παραγωγή\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"Λογισμικό υπολογισμών δοχείων πίεσης (π.χ. Codeware COMPRESS)\"},{\"kind\":\"li\",\"text\":\"Λογισμικό CAD\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Μηχανολόγου Μηχανικού, Χημικού/Ναυπηγού Μηχανικού/Ηλεκτρολόγου Μηχανικού\"},{\"kind\":\"li\",\"text\":\"Γνώση λογισμικού υπολογισμών μηχανικής αντοχής\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Χρόνος ολοκλήρωσης τεχνικής μελέτης ανά παραγγελία\"},{\"kind\":\"li\",\"text\":\"Ποσοστό μελετών χωρίς αναθεώρηση μετά τον έλεγχο\"},{\"kind\":\"li\",\"text\":\"Ποσοστό συμμόρφωσης με πρότυπα σε εξωτερικούς ελέγχους\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5 ετών σε σχεδιασμό ή R&D εναλλακτών θερμότητας ή θερμικού εξοπλισμού\"}],\"children\":[],\"depth\":4},{\"id\":\"r37\",\"dept\":\"Τεχνική Διεύθυνση\",\"title\":\"Product Certifications Engineer\",\"short\":\"Product Certifications Engineer\",\"reportsTo\":\"Engineering Manager\",\"parent\":34,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό τη διαχείριση της πιστοποίησης και κανονιστικής συμμόρφωσης των προϊόντων της εταιρείας (ASME, PED/CE, νηογνώμονες), διασφαλίζοντας ότι κάθε προϊόν πληροί τις απαιτήσεις των αγορών όπου διατίθεται.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"-\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τη διαδικασία απόκτησης και διατήρησης πιστοποίησης ASME (π.χ. U Stamp) για την κατασκευή δοχείων πίεσης\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται και διατηρεί τις πιστοποιήσεις ABS Type Approved Product και DNV-GL Maritime Manufacturer της εταιρείας\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται παράλληλα και ξεχωριστά τη διαδικασία πιστοποίησης PED/CE για προϊόντα που διατίθενται στην ευρωπαϊκή αγορά, καθώς η πιστοποίηση ASME δεν αναγνωρίζεται αυτόματα ως PED/CE\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και υποβάλλει τεχνικούς φακέλους, αναφορές δοκιμών και αιτήσεις πιστοποίησης\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει Πλάνα Ελέγχου (Inspection Test Plans – ITPs) που εγκρίνει ο πελάτης και παραλαμβάνει η Παραγωγή ως κατευθυντήριο έγγραφο, για PED και μη-PED έργα\"},{\"kind\":\"li\",\"text\":\"Καταγράφει τις αναφορές μη καταστροφικού ελέγχου (PT & UT) που εκτελούν πιστοποιημένοι Level II operators, όταν τις ζητά ο πελάτης\"},{\"kind\":\"li\",\"text\":\"Προγραμματίζει την επαναδιακρίβωση και ανανέωση πιστοποιήσεων του εξοπλισμού της ίδιας της εταιρείας (όργανα μέτρησης, οχήματα, α \"Product Design Specialist, Heads τμημάτων παραγωγής\",\"Κατά περίπτωση\",\"Διασφάλιση εφαρμοσιμότητας σχεδίου, εντοπισμός ζητημάτων κατασκευασιμότητας πριν την έναρξη\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"CAD λογισμικό (π.χ. Inventor, AutoCAD)\"},{\"kind\":\"li\",\"text\":\"ERP για MBOM και κατασκευαστικά δεδομένα\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Μηχανολόγου Μηχανικού (ΑΕΙ ή ΤΕΙ)\"},{\"kind\":\"li\",\"text\":\"Πολύ καλή γνώση CAD (Inventor ή αντίστοιχο) και μεθόδων κατασκευής\"},{\"kind\":\"li\",\"text\":\"Καλή γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Χρόνος ολοκλήρωσης κατασκευαστικού σχεδίου ανά έργο\"},{\"kind\":\"li\",\"text\":\"Ποσοστό προσφορών χωρίς αναθεώρηση από την Παραγωγή\"},{\"kind\":\"li\",\"text\":\"Αριθμός αλλαγών σχεδίων (ECNs) ανά έργο\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5+ ετών σε κατασκευαστικό σχεδιασμό βιομηχανικού περιβάλλοντος\"}],\"children\":[],\"depth\":4},{\"id\":\"r43\",\"dept\":\"Διεύθυνση Παραγωγής\",\"title\":\"Plant Director\",\"short\":\"Plant Director\",\"reportsTo\":\"Γενικό Διευθυντή\",\"parent\":1,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Να εξασφαλίζει την έγκαιρη, αποτελεσματική, ποιοτική, ασφαλή και οικονομικά αποδοτική παραγωγή των μονάδων της επιχείρησης. Αξιοποιεί τις βιομηχανικές και υλικοτεχνικές υποδομές και το έμψυχο δυναμικό σύμφωνα με τις βέλτιστες πρακτικές λειτουργίας.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Υπεύθυνους Design, Planning, Quality Control και Υπεύθυνους / Τομεάρχες παραγωγικών μονάδων κτηρίων Μαρκοπούλου και Λαυρίου\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Συντονίζει πολλαπλά χρονοδιαγράμματα παραγωγής και εξασφαλίζει την αποτελεσματικότερη χρήση των πόρων\"},{\"kind\":\"li\",\"text\":\"Φροντίζει για την καλύτερη προετοιμασία της παραγωγής και προλαμβάνει προβλήματα, ενώ επιλύει πιθανά έκτακτα ζητήματα του τομέα ευθύνης έγκαιρα και με ασφάλεια\"},{\"kind\":\"li\",\"text\":\"Ενημερώνεται για τις εξελίξεις του κλάδου, τις τάσεις της αγοράς και εντοπίζει νέους προμηθευτές, πόρους και υλικοτεχνική υποδομή για την κάλυψη των μεταβαλλόμενων απαιτήσεων της παραγωγής\"},{\"kind\":\"li\",\"text\":\"Εφαρμόζει αποτελεσματικά και τηρεί τις οδηγίες (Κανονισμός Εργασίας, ασφάλειας και ποιότητας) και φροντίζει για την επικαιροποίηση του όταν κρίνεται αναγκαίο\"},{\"kind\":\"li\",\"text\":\"Εκπαιδεύει τους τομεάρχες για θέματα οργάνωσης, προσοχής και αρχών λειτουργίας καθώς και βέλτιστων πρακτικών\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί στενά την στοχοθεσία των τομεαρχών παραγωγής, παρακολουθώντας τους δείκτες προόδου των εργασιών (KPIs/objectives)\"},{\"kind\":\"li\",\"text\":\"Παρέχει καθοδήγηση αλλά και ελέγχει τους τομεάρχες για τις αρμοδιότητες και το παραγόμενο έργο\"},{\"kind\":\"li\",\"text\":\"Τροφοδοτεί έγκαιρα το πλανόγραμμα εργασίας/παραγωγής με τακτικές και έκτακτες ανάγκες\"},{\"kind\":\"li\",\"text\":\"Παρακινεί, καθοδηγεί και εμψυχώνει τους ανθρώπους και συνδράμει στην κουλτούρα συνεργασίας και καλού εργασιακού κλίματος\"},{\"kind\":\"li\",\"text\":\"Επιλύει ζητήματα παρανοήσεων ή συγκρούσεων που ενδέχεται να προκύψουν εντός των μονάδων\"},{\"kind\":\"li\",\"text\":\"Τροφοδοτεί με ακρίβεια το σύστημα καταγραφής υπερεργασίας, υπερωριών, αδειών και αιτήματα των εργαζομένων\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με τις αρμόδιες ομάδες για την διασφάλιση και τήρηση των προτύπων ασφάλειας και ποιότητας\"},{\"kind\":\"li\",\"text\":\"Διευκολύνει το έργο των τεχνικών ομάδων για την πρόσβαση, καταγραφή και επίλυση των βλαβών\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με τις διευθύνσεις εμπορικής διεύθυνσης, εφοδιαστικής αλυσίδας / αποθήκης για την αποτελεσματική ροή των εργασιών\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει εκθέσεις ενημέρωσης της διοίκησης σχετικά με δείκτες ικανοποίησης των παραγόμενων προϊόντων (Net promoter score) κτλ.\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με Γενικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται καθημερινά με το γενικό διευθυντή για τρέχοντα θέματα εργασιών\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει σε συνεργασία με τον Γ.Δ., τους Διευθυντές και τους τομεάρχες το πλανόγραμμα και τους προϋπολογισμούς κόστους (σε χρόνους και είδος – πρώτες ύλες)\"},{\"kind\":\"li\",\"text\":\"Παρέχει έγκυρες και εντός χρονικών ορίων πληροφορίες για θέματα μείζονος σημασίας (ροή παραγωγής, πιθανές καθυστερήσεις, τεχνικές ανάγκες κ.α.)\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει σε θεσμοθετημένες τμηματικές και δια-τμηματικές συσκέψεις διατηρώντας ουσιαστικό και κρίσιμο ρόλο\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται καθημερινά με τους προϊσταμένους τμημάτων (π.χ. τεχνικό, προμηθειών, εφοδιαστικής αλυσίδας, εμπορικό κτλ. για όλη την γκάμα θεμάτων που αφορούν τις παραγγελίες υλοποίησης παραγωγής, εξοπλισμό των εργαζομένων, συντηρήσεις μηχανολογικού εξοπλισμού, παραγγελίες πρώτων υλών)\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Επικοινωνία σε επίπεδο διευθυντικής ομάδας και ανώτατης διοίκησης\"},{\"kind\":\"li\",\"text\":\"Ανάπτυξη και εκπαίδευση διοικητικών στελεχών σε αρχές λειτουργίας και βέλτιστες πρακτικές\"},{\"kind\":\"li\",\"text\":\"Στρατηγική σκέψη και μακροπρόθεσμος σχεδιασμός\"},{\"kind\":\"li\",\"text\":\"Δυνατότητα διαχείρισης παράλληλων εργασιών\"},{\"kind\":\"li\",\"text\":\"Προσαρμοστικότητα σε μεταβαλλόμενες συνθήκες παραγωγής και αγοράς\"},{\"kind\":\"li\",\"text\":\"Επιρροή και συντονισμός σε επίπεδο διευθυντικής ομάδας\"},{\"kind\":\"li\",\"text\":\"Εντιμότητα - αξιοπιστία - φερεγγυότητα\"},{\"kind\":\"li\",\"text\":\"Ανάληψη πρωτοβουλιών\"},{\"kind\":\"li\",\"text\":\"Διαμόρφωση οργανωτικής κουλτούρας και εργασιακού κλίματος σε επίπεδο μονάδας\"},{\"kind\":\"li\",\"text\":\"Ικανότητα διοίκησης ανθρώπων (Ηγεσία)\"},{\"kind\":\"li\",\"text\":\"Ικανότητα ανάθεσης εργασιών\"},{\"kind\":\"li\",\"text\":\"Ευρύτερη γνώση τάσεων κλάδου, αγοράς και εξελίξεων βιομηχανικής παραγωγής\"},{\"kind\":\"li\",\"text\":\"Γνώση Κανονισμού Εργασίας, ασφάλειας και ποιότητας σε επίπεδο πολιτικής, με ευθύνη επικαιροποίησης\"},{\"kind\":\"li\",\"text\":\"Αναλυτική και συνθετική σκέψη\"},{\"kind\":\"li\",\"text\":\"Διάθεση για μάθηση\"},{\"kind\":\"li\",\"text\":\"Προσανατολισμός στο ποιοτικό τελικό αποτέλεσμα\"},{\"kind\":\"li\",\"text\":\"Διαχείριση στρες\"},{\"kind\":\"li\",\"text\":\"Αποφασιστικότητα\"},{\"kind\":\"li\",\"text\":\"Ενσυναίσθηση\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Προϋπολογισμός εργασιών & Πλανογράμματα\",\"Plant Director\",\"Δ/ντες σε συνεργασία με Γ.Δ.\",\"Τακτικά\"],[\"Καταστάσεις εργαζομένων\",\"Plant Director\",\"HR Manager\",\"Τακτικά\"],[\"Αναφορές που δέχεται\"],[\"Αναφορά προόδου παραγωγής και δεικτών (KPIs)\",\"Plant Manager\",\"Plant Director\",\"Τακτικά\"],[\"Ευρήματα εσωτερικών ελέγχων ασφάλειας/ποιότητας\",\"Head of Quality Assurance, Environment, Health & Safety & ISO\",\"Plant Director\",\"Τακτικά\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Σύσκεψη στοχοθεσίας τομεαρχών παραγωγής\",\"Plant Director, Plan Manager, Heads τμημάτων παραγωγής\",\"Μηνιαία\",\"Παρακολούθηση στοχοθεσίας και δεικτών προόδου (KPIs/objectives) των τομεαρχών\"],[\"Σύσκεψη νέων προμηθευτών και υλικοτεχνικής υποδομής\",\"Plant Director, Plant Manager, Purchasing Manager\",\"Περιοδική\",\"Αξιολόγηση νέων προμηθευτών/πόρων για κάλυψη μεταβαλλόμενων αναγκών παραγωγής\"],[\"Σύσκεψη συντονισμού τεχνικών ομάδων και παραγωγής\",\"Plant Director, Plant Manager, Technical Director\",\"Περιοδική\",\"Διευκόλυνση πρόσβασης/καταγραφής/επίλυσης τεχνικών βλαβών\"],[\"Σύσκεψη επίλυσης εργασιακής σύγκρουσης\",\"Plant Director, Plant Manager, HR Director\",\"Κατά περίπτωση\",\"Επίλυση ζητημάτων παρανοήσεων ή συγκρούσεων εντός των μονάδων\"],[\"Σύσκεψη κατάρτισης προϋπολογισμού παραγωγής\",\"Γενικός Διευθυντής, Operations Director, Finance Manager\",\"Ετήσια\",\"Κατάρτιση προϋπολογισμού κόστους (χρόνων και είδος πρώτων υλών)\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"ERP\"},{\"kind\":\"li\",\"text\":\"MS Office (word, excel, PowerPoint, outlook)\"},{\"kind\":\"li\",\"text\":\"Άλλα Συστήματα\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο τεχνικών επιστημών ή συναφές αντικείμενο\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος θεωρείται επιπλέον προσόν (MSC, MBA)\"},{\"kind\":\"li\",\"text\":\"Εκπληρωμένες στρατιωτικές υποχρεώσεις\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Ρυθμός Παραγωγής (Throughput -Units Produced)\"},{\"kind\":\"li\",\"text\":\"Συνολική Αποτελεσματικότητα Εξοπλισμού (Overall Equipment Effectiveness - OEE)\"},{\"kind\":\"li\",\"text\":\"Πραγματοποίηση Ρυθμού Παραγωγής (Takt Attainment)\"},{\"kind\":\"li\",\"text\":\"Μέσος Χρόνος Μεταξύ Βλαβών (Mean Time Between Failures - (MTBF)\"},{\"kind\":\"li\",\"text\":\"Μέσος Χρόνος Επισκευής (Mean Time To Repair - MTTR)\"},{\"kind\":\"li\",\"text\":\"Ασφάλεια, Ποιότητα, Παράδοση, Κόστος (SQDC — Safety, Quality, Delivery, Cost) σε επίπεδο μονάδας\"},{\"kind\":\"li\",\"text\":\"Τήρηση Προϋπολογισμού Μονάδας (Budget Variance)\"},{\"kind\":\"li\",\"text\":\"Δείκτης Συχνότητας Ατυχημάτων (Lost Time Injury Rate - LTIR)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Επιτυχίας Πρώτης Διέλευσης (First Pass Yield - FPY)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Απορριμμάτων (Scrap Rate)\"},{\"kind\":\"li\",\"text\":\"Έγκαιρη Παράδοση (On-Time Delivery -OTD)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 15-20 χρόνια σε τμήματα βιομηχανικής παραγωγής, εκ των οποίων 10 χρόνια σε προϊσταμενική θέση βιομηχανικής μονάδας\"}],\"children\":[44],\"depth\":2},{\"id\":\"r44\",\"dept\":\"Διεύθυνση Παραγωγής\",\"title\":\"Plant Manager\",\"short\":\"Plant Manager\",\"reportsTo\":\"Plant Director\",\"parent\":43,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό τον καθημερινό συντονισμό και τη διοίκηση όλων των τμημάτων παραγωγής, μετουσιώνοντας τη στρατηγική κατεύθυνση του Plant Director σε καθημερινή εκτέλεση, διασφαλίζοντας την έγκαιρη, ποιοτική, ασφαλή και οικονομικά αποδοτική παραγωγή.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Head of Production Planning, Head of Machine Maintenance, Head of Quality Control, Bill of Materials & Manufacturing Methods, Head of Steel Construction, Head of Expander, Head of CNC Machining, Head of Conventional Machines, Head of A&T&P&P\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Συντονίζει καθημερινά τα τμήματα παραγωγής (Steel Construction, Expander, CNC Machining, Conventional Machining, Assembly & Testing/Paint & Packing) ώστε να τηρούνται τα χρονοδιαγράμματα\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί την απόδοση κάθε τμήματος μέσω δεικτών προόδου (KPIs) και παρεμβαίνει σε αποκλίσεις\"},{\"kind\":\"li\",\"text\":\"Επιλύει έκτακτα ζητήματα παραγωγής (βλάβες, ελλείψεις υλικών, καθυστερήσεις)\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται και κατανέμει ανθρώπινους και υλικούς πόρους μεταξύ τμημάτων ανάλογα με τις ανάγκες παραγωγής\"},{\"kind\":\"li\",\"text\":\"Επιβλέπει τη λειτουργία Bill of Materials & Manufacturing Methods για την ακρίβεια των τεχνικών προδιαγραφών παραγωγής\"},{\"kind\":\"li\",\"text\":\"Εκπαιδεύει και καθοδηγεί τους Heads των τμημάτων σε θέματα οργάνωσης και βέλτιστων πρακτικών\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Head of Machine Maintenance για την προγραμματισμένη και έκτακτη συντήρηση εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Head of Quality Control για τη διασφάλιση ποιοτικών προτύπων στην παραγωγή\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει την τήρηση κανόνων ασφαλείας και ποιότητας σε όλα τα τμήματα\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Plant Director\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την πορεία παραγωγής και τυχόν κρίσιμα ζητήματα\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει κατεύθυνση για στρατηγικές προτεραιότητες και πλανόγραμμα\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στην κατάρτιση προϋπολογισμών παραγωγής\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Εμπορικό τμήμα για τεχνικές απαιτήσεις παραγγελιών και χρονοδιαγράμματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τμήμα Αγορών και την Αποθήκη για τη διαθεσιμότητα υλικών\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τεχνικό τμήμα για προδιαγραφές νέων προϊόντων\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Άριστη και σαφής επικοινωνία με προϊσταμένους τμημάτων παραγωγής\"},{\"kind\":\"li\",\"text\":\"Δεξιότητες στη διαχείριση προγραμμάτων παραγωγής\"},{\"kind\":\"li\",\"text\":\"Διαχείριση προϋπολογισμού και κόστους λειτουργίας\"},{\"kind\":\"li\",\"text\":\"Διοίκηση πολλαπλών έργων και χρονοδιαγραμμάτων\"},{\"kind\":\"li\",\"text\":\"Επίλυση προβλημάτων υπό πίεση χρόνου\"},{ nd\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό τη διασφάλιση της ποιότητας των παραγόμενων προϊόντων, μέσω ποιοτικού ελέγχου τελικών προϊόντων και δειγματοληπτικών ελέγχων σε κρίσιμα στάδια παραγωγής, διασφαλίζοντας τη συμμόρφωση με τις προδιαγραφές του πελάτη πριν την αποστολή.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"-\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει διενεργεί ποιοτικό έλεγχο των τελικών προϊόντων πριν τη συσκευασία και αποστολή\"},{\"kind\":\"li\",\"text\":\"Ελέγχει την ποιότητα συγκολλήσεων (προφίλ, πάχος) σύμφωνα με τις προδιαγραφές, ιδίως όπου ο πελάτης απαιτεί μη καταστροφικό έλεγχο (Non-Destructive Testing, οπτικός έλεγχος, ραδιογραφία)\"},{\"kind\":\"li\",\"text\":\"Πραγματοποιεί δειγματοληπτικούς ελέγχους σε ενδιάμεσα στάδια παραγωγής, ανάλογα με τις απαιτήσεις κάθε παραγγελίας\"},{\"kind\":\"li\",\"text\":\"Καταγράφει και τεκμηριώνει εντοπισμένες αστοχίες, ώστε να είναι σαφές στους συγκολλητές τι πρέπει να διορθωθεί\"},{\"kind\":\"li\",\"text\":\"Είναι παρών κατά τις επιθεωρήσεις εξωτερικών επιθεωρητών πελατών\"},{\"kind\":\"li\",\"text\":\"Συντονίζει και επιβλέπει τη διαδικασία χάραξης nameplates βάσει του εβδομαδιαίου προγράμματος αποστολών, ενημερώνοντας τον υπεύθυνο χάραξης τι πρέπει να χαραχθεί\"},{\"kind\":\"li\",\"text\":\"Δίνει την τελική έγκριση ποιοτικού ελέγχου πριν την αποστολή στον πελάτη\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τους υπεύθυνους παραγωγής για αστοχίες και συμφωνεί μαζί τους λύσεις ανάλογα με τον διαθέσιμο χρόνο παράδοσης\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Plant Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για ευρήματα ποιοτικού ελέγχου, καθυστερήσεις και κρίσιμα ζητήματα\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει προτεραιότητες όταν υπάρχει σύγκρουση μεταξύ πολλαπλών ταυτόχρονων αναγκών ελέγχου\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με NT-TC-1A)\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό προϊόντων που περνούν τον ποιοτικό έλεγχο με την πρώτη προσπάθεια (First Pass Yield)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό αστοχιών που διαφεύγουν τον έλεγχο και φτάνουν στον πελάτη (Defect Escape Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό παραπόνων πελατών σχετικά με ποιότητα (Customer Complaint Rate)\"},{\"kind\":\"li\",\"text\":\"Χρόνος ολοκλήρωσης ποιοτικού ελέγχου ανά παραγγελία\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 7+ ετών σε ποιοτικό έλεγχο βιομηχανικών προϊόντων ή συγκολλήσεων, εκ των οποίων 2-3 σε εποπτική θέση\"}],\"children\":[],\"depth\":4},{\"id\":\"r49\",\"dept\":\"Διεύθυνση Παραγωγής\",\"title\":\"Bills of Materials & Manufacturing Methods\",\"short\":\"Bills of Materials & Manufacturing Methods\",\"reportsTo\":\"Plant Manager\",\"parent\":44,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό τη δημιουργία, τήρηση και επικαιροποίηση του Καταλόγου Υλικών Παραγωγής (Manufacturing BOM) και των μεθόδων κατασκευής, μετατρέποντας τον Κατάλογο Υλικών Σχεδιασμού (EBOM) που παραλαμβάνει από το Σχεδιαστικό τμήμα σε ακριβή, εφαρμόσιμα δεδομένα παραγωγής, διασφαλίζοντας την ακρίβεια παραγωγής, την αποδοτική διαχείριση αποθεμάτων και τη διασφάλιση ποιότητας.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"-\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Παραλαμβάνει τον Κατάλογο Υλικών Σχεδιασμού (EBOM) και τα κατασκευαστικά σχέδια από το Σχεδιαστικό Τμήμα\"},{\"kind\":\"li\",\"text\":\"Μετατρέπει τον EBOM σε Κατάλογο Υλικών Παραγωγής (MBOM), προσθέτοντας τη σειρά συναρμολόγησης, αναλώσιμα και μεθόδους κατασκευής\"},{\"kind\":\"li\",\"text\":\"Καταχωρεί και επικαιροποιεί τον MBOM στο ERP, διαχειριζόμενος πολυεπίπεδες δομές, κωδικούς και αναθεωρήσεις\"},{\"kind\":\"li\",\"text\":\"Εφαρμόζει και τεκμηριώνει αλλαγές μηχανολογικού σχεδιασμού (ECOs/ECNs) στον MBOM\"},{\"kind\":\"li\",\"text\":\"Ορίζει και τεκμηριώνει μεθόδους κατασκευής ανά στάδιο παραγωγής, σε συνεργασία με τους Heads των τμημάτων παραγωγής\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει την ανάλυση κόστους και τον σχεδιασμό αναγκών υλικού (MRP) βάσει του MBOM\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει τη συνέπεια και ακρίβεια δεδομένων μεταξύ EBOM και MBOM\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τα δικαιώματα πρόσβασης και τροποποίησης του MBOM στο ERP\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Plant Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει για την πρόοδο ενημέρωσης MBOM και τυχόν αποκλίσεις\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει προτεραιότητες ανά έργο\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τον Production Designer για τη λήψη του EBOM\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τους προϊσταμένους (Heads) των τμημάτων παραγωγής για τον ορισμό μεθόδων κατασκευής\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τμήμα Αγορών για τον σχεδιασμό αναγκών υλικού (MRP)\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Costing & Preparation για δεδομένα κόστους υλικών\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Διαχείριση πολυεπίπεδων δομών BOM σε ERP/MRP και PLM συστήματα\"},{\"kind\":\"li\",\"text\":\"Τεκμηρίωση αλλαγών μηχανολογικού σχεδιασμού Change Order Management)\"},{\"kind\":\"li\",\"text\":\"Έλεγχος και τήρηση τεκμηρίωσης (Documentation Control)\"},{\"kind\":\"li\",\"text\":\"Προσοχή στη λεπτομέρεια και ακρίβεια δεδομένων\"},{\"kind\":\"li\",\"text\":\"Συνεργασία με πολλαπλά τμήματα\"},{\"kind\":\"li\",\"text\":\"Προσαρμοστικότητα σε αλλαγές σχεδίου και μεθόδων κατασκευής\"},{\"kind\":\"li\",\"text\":\"Ανάλυση δεδομένων\"},{\"kind\
