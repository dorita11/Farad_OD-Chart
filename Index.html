document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"el\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Interactive Chart<\u002Ftitle>\n<script>window.OD_ROLES = [{\"id\":\"r0\",\"dept\":\"Διοικηση\",\"title\":\"Διοικητικο Συμβουλιο\",\"short\":\"Διοικητικο Συμβουλιο\",\"reportsTo\":\"\",\"parent\":null,\"virtual\":true,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"p\",\"text\":\"Μη εκχωρουμενες αρμοδιοτητες του Διοικητικου Συμβουλιου.\"}],\"children\":[1],\"depth\":0},{\"id\":\"r1\",\"dept\":\"Γενική Διεύθυνση\",\"title\":\"Διευθύνων Σύμβουλος\",\"short\":\"Διευθύνων Σύμβουλος\",\"reportsTo\":\"Δ.Σ. των μετόχων\",\"parent\":0,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Η διαχείριση και συντονισμός των επικεφαλής των διευθύνσεων λειτουργίας, η συνεργασία με την ομάδα των μετόχων για την υλοποίηση της στρατηγικής της επιχείρησης και επίτευξη των στόχων σε Ελλάδα και εξωτερικό και η διασφάλιση της βιωσιμότητας της εταιρείας στο γενικότερο επιχειρηματικό περιβάλλον.\"},{\"kind\":\"h\",\"text\":\"Τομεάρχες τμημάτων που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Οικονομικός Διευθυντής, Τεχνικός Διευθυντής / Παραγωγής, Εμπορικός Διευθυντής & Διευθυντής Μάρκετινγκ, Διευθυντής Λειτουργιών και Οικονομικής Διεύθυνσης, Διευθυντής Διασφάλισης Ποιότητας, Διευθυντής Ανθρώπινου Δυναμικού\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με την ομάδα των μετόχων της επιχείρησης για το σχεδιασμό της γενικής στρατηγικής και φροντίζει την υλοποίηση της\"},{\"kind\":\"li\",\"text\":\"Συντονίζει το σύνολο της εμπορικής και οικονομικής πολιτικής της εταιρείας\"},{\"kind\":\"li\",\"text\":\"Έχει την ευθύνη της τιμολογιακής και πιστωτικής πολιτικής\"},{\"kind\":\"li\",\"text\":\"Συντονίζει τις επιμέρους διευθύνσεις για αποτελεσματική υλοποίηση στόχων\"},{\"kind\":\"li\",\"text\":\"Διατηρεί θέση στο Διοικητικό Συμβούλιο της εταιρείας και ενημερώνει για όλα τα ζητήματα της εταιρείας την ομάδα των μετόχων στις τακτικές και έκτακτες συναντήσεις\"},{\"kind\":\"li\",\"text\":\"Προεδρεύει των συσκέψεων και συναντήσεων με τα μέλη της διοικητικής\"},{\"kind\":\"li\",\"text\":\"Αναθέτει καθήκοντα στα μέλη της διοικητικής ομάδας, καθώς και ηγείται, καθοδηγεί, παρακινεί και τα ενδυναμώνει για αποδοτική υλοποίηση εργασιών\"},{\"kind\":\"li\",\"text\":\"Μεριμνά για τη διατήρηση θετικού εργασιακού κλίματος\"},{\"kind\":\"li\",\"text\":\"Διατηρεί την ευθύνη για τον αποτελεσματικό ετήσιο προϋπολογισμό (budget) της εταιρείας σε συνεργασία με τον Οικονομικό διευθυντή\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται με πελάτες, εξωτερικούς προμηθευτές και αντιπροσώπους\"},{\"kind\":\"li\",\"text\":\"Διερευνά επιχειρηματικές ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Διαπραγματεύεται με πελάτες Key Accounts τους όρους της συνεργασίας και πληρωμής\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τίς κινήσεις του ανταγωνισμού σε Ελλάδα & εξωτερικό και προβαίνει στις κατάλληλες τακτικές και ενέργειες\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται με διάφορους φορείς του κλάδου, τοπικά επιμελητήρια και οργανώσεις\"},{\"kind\":\"li\",\"text\":\"Εκπροσωπεί την εταιρεία σε εκθέσεις, ομιλίες, συνέδρια του κλάδου\"},{\"kind\":\"li\",\"text\":\"Χαράσσει την επικοινωνιακή πολιτική της εταιρείας έχοντας την κύρια ευθύνη για την καλή εταιρική εικόνα προς την αγορά και τους συνεργαζόμενους φορείς\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί και ενημερώνεται από τον ειδικό και γενικό τύπο για νέες τάσεις και δεδομένα που διαδραματίζονται στο οικονομικό και επιχειρηματικό περιβάλλον\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με άλλες θυγατρικές του ομίλου για νέα projects\"},{\"kind\":\"li\",\"text\":\"Διατηρεί θέση νόμιμου εκπροσώπου της εταιρείας απέναντι στις αρχές\"},{\"kind\":\"li\",\"text\":\"Επιλέγει και συντονίζει τους εξωτερικούς συμβούλους με τους οποίους συνεργάζεται η εταιρεία\"},{\"kind\":\"li\",\"text\":\"Δεσμεύεται με την αποτελεσματική εφαρμογή των πολιτικών της εταιρείας σε θέματα διαχείρισης εργαζομένων (όπως προαγωγές, αυξήσεις, εκπαίδευσης, ωφελημάτων, bonus που αφορούν τα στελέχη της εταιρείας κτλ.)\"},{\"kind\":\"li\",\"text\":\"Αποφασίζει για τη στελέχωση νέων θέσεων εργασίας, δίνοντας την έγκρισή του.\"},{\"kind\":\"li\",\"text\":\"Παραμένει «θεματοφύλακας» των αρχών και των προτύπων της εταιρείας, φροντίζοντας να εκφράζονται αυτά από το σύνολο του προσωπικού.\"},{\"kind\":\"h\",\"text\":\"Κύρια στοιχεία προσωπικότητάς, δεξιοτήτων και ικανοτήτων που απαιτεί η θέση:\"},{\"kind\":\"li\",\"text\":\"Ηγεσία\"},{\"kind\":\"li\",\"text\":\"Κρίση/Αποφασιστικότητα/Πρωτοβουλία\"},{\"kind\":\"li\",\"text\":\"Επιρροή (Impact)\"},{\"kind\":\"li\",\"text\":\"Υψηλό I.Q. και E.Q.\"},{\"kind\":\"li\",\"text\":\"Στρατηγική σκέψη\"},{\"kind\":\"li\",\"text\":\"Οργάνωση / προγραμματισμός\"},{\"kind\":\"li\",\"text\":\"Συνεργασία & Ομαδικότητα\"},{\"kind\":\"li\",\"text\":\"Ικανότητα ανάθεσης εργασιών\"},{\"kind\":\"li\",\"text\":\"Ικανότητα διαχείρισης παράλληλων και πολύπλοκών θεμάτων\"},{\"kind\":\"li\",\"text\":\"Αντίληψη και ικανότητα αποκωδικοποίησης σύνθετων πληροφοριών\"},{\"kind\":\"li\",\"text\":\"Επικοινωνιακές ικανότητες\"},{\"kind\":\"li\",\"text\":\"Διαχείριση Κρίσεων\"},{\"kind\":\"li\",\"text\":\"Επίλυση προβλημάτων\"},{\"kind\":\"li\",\"text\":\"Business Know How\"},{\"kind\":\"h\",\"text\":\"ΠΛΑΙΣΙΩΝΕΤΕ ΑΠΟ\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές Αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Ετήσιος Προϋπολογισμός (Annual budget)\",\"Γ.Δ. σε συνεργασία με Οικ. Δ/ντη\",\"Εκπρόσωπο/-ους Μετόχων\",\"Ετήσιο\"],[\"Έκθεση λειτουργίας και δεικτών\",\"Επικεφαλής διευθύνσεων\",\"Γ.Δ. Εκπρόσωπο/-ους Μετόχων\",\"6μηνιαίο\"]]},{\"kind\":\"table\",\"head\":[\"Αναφορές που δέχεται\"],\"body\":[[\"Παρακολούθηση Δεικτών (KPI’s)\",\"Επικεφαλής διευθύνσεων\",\"\",\"Μηνιαίο\"],[\"P&L, Balance sheet\",\"Διευθυντής Λειτουργιών (COO) & Finance Manager\",\"Εκπρόσωπο/-ους Μετόχων\",\"Μηνιαίο\"],[\"Cash Flow Forecast\",\"Διευθυντής Λειτουργιών (COO) & Finance Manager\",\"\",\"Μηνιαίο\"],[\"Sales Pipeline Report\",\"Commercial Director\",\"\",\"\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές Συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Meeting με Μετόχους\",\"Εκπρόσωπο/-ους Μετόχων\",\"Μηναίο\",\"Κρίσιμα εμπορικά και οικονομικά θέματα\"],[\"Συζητήσεις Εμπορικού Ενδιαφέροντος\",\"Οικ. Δ/ντης, Εμπορικός Δ/ντης Credit controller (εκ περιτροπής) Εκπρόσωπο/-ους Μετόχων, Τεχνικός Διευθυντής\",\"Μηνιαίο\",\"Εμπορικά θέματα Πελάτες Σχεδιασμός κινήσεων\"],[\"Meeting Παραγωγής, διασφάλισης Ποιότητας\",\"Δ/ντη Παραγωγής & Τεχνικό Δ/ντη Εκπρόσωπο/-ους Μετόχων\",\"Τακτικό\",\"Θέματα ροής της παραγωγής, συντηρήσεων κτλ.\"],[\"Operations & Financial managers meeting\",\"Εκπρόσωπο/-ους Μετόχων\",\"3μηνιαίο\",\"Λειτουργικά και Οικονομικά θέματα\"],[\"Meeting με HR\",\"Γ.Δ. Ελλάδας Οικονομικός Δ/ντης Δ/ντη Παραγωγής Εκπρόσωπο/-ους Μετόχων (προαιρετικό)\",\"Τακτικό\",\"Follow up θέματα ανθρώπινου δυναμικού\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"MS Office (word, excel, PowerPoint outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Ανώτατης σχολής (μηχανολογικής ή οικονομικής κατεύθυνσης ή διοίκησης επιχειρήσεων) ή συναφές αντικείμενο\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ\"},{\"kind\":\"li\",\"text\":\"Δίπλωμα οδήγησης\"},{\"kind\":\"li\",\"text\":\"Δυνατότητα μετακινήσεων εντός και εκτός Ελλάδος\"},{\"kind\":\"li\",\"text\":\"Εκπληρωμένες στρατιωτικές υποχρεώσεις\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος (επιθυμητός)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"15-20 χρόνια προϋπηρεσία (τα μισά εξ αυτών σε διευθυντικές θέσεις)\"},{\"kind\":\"li\",\"text\":\"10 χρόνια σε θέσεις ευθύνης εμπορικής διεύθυνσης (ιδανικά σε βιομηχανικό τομέα και σε ρόλους ανάπτυξης αγοράς (business development)\"},{\"kind\":\"li\",\"text\":\"Εμπειρία με έργα ιδιωτικού & δημοσίου τομέα\"}],\"children\":[2,3,13,32,43],\"depth\":1},{\"id\":\"r2\",\"dept\":\"Γενικη Διευθυνση\",\"title\":\"Στελέχη Υποστήριξης Γενικής Διεύθυνσης\",\"short\":\"Στελέχη Υποστήριξης Γενικής Διεύθυνσης\",\"reportsTo\":\"Γενικο Διευθυντη\",\"parent\":1,\"virtual\":true,\"noPanel\":true,\"staffList\":[\"Τεχνικος Ασφαλειας\",\"Ιατρος Εργασιας\",\"Νομικος Συμβουλος\",\"Προσωπικη Γραμματεας\"],\"blocks\":[],\"children\":[],\"depth\":2},{\"id\":\"r3\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Διευθυντής Εμπορικής Στρατηγικής, Εμπορικών Σχέσεων και Μάρκετινγκ (Commercial Director)\",\"short\":\"Commercial Director\",\"reportsTo\":\"Γενικό Διευθυντή\",\"parent\":1,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Διττός ρόλος καθώς εστιάζεται α) ως διευθυντής εμπορικών σχέσεων στην ανάπτυξη νέων αγορών, την διαχείριση εμπορικών σχέσεων με τρέχον πελατολόγιο και την διαχείριση της ομάδας πωλήσεων/εξυπηρέτησης πελατών, β) ως επικεφαλής marketing για όλες τις δραστηριότητες προώθησης, έρευνα αγοράς, τη διαφήμιση, και τον προγραμματισμό βραχυπρόθεσμων και μακροπρόθεσμων στρατηγικών marketing.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Διευθυντής πωλήσεων και η ομάδα του που περιλαμβάνει πωλήσεις εξωτερικού και εσωτερικού, παραγγελίες, και σχέσεων με πελάτες. Υπεύθυνος σχεδιασμού και υλοποίησης στρατηγικής μάρκετινγκ.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Υπεύθυνος για τη διαχείριση του εμπορικού τμήματος, τη δημιουργία στρατηγικών για την αύξηση των εσόδων και των κερδών της εταιρείας.\"},{\"kind\":\"li\",\"text\":\"Είναι υπεύθυνος για την ανάπτυξη και εφαρμογή στρατηγικών πωλήσεων.\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί την απόδοση των πωλήσεων και καθορίζει στόχους.\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται την ομάδα πωλήσεων και εξασφαλίζει την επίτευξη των στόχων.\"},{\"kind\":\"li\",\"text\":\"Συντονίζει την ομάδα εσωτερικών ή και εξωτερικών συνεργατών που καλύπτουν τις ενέργειες Marketing για την προώθηση των προϊόντων αλλά και της εταιρικής εικόνας εντός και εκτός Ελλάδας.\"},{\"kind\":\"li\",\"text\":\"Ενημερώνεται για τις εξελίξεις του κλάδου, τις τάσεις της αγοράς και εντοπίζει εναλλακτικές για τα πρότυπα ποιότητας\"},{\"kind\":\"li\",\"text\":\"Αναλύει την αγορά και τον ανταγωνισμό.\"},{\"kind\":\"li\",\"text\":\"Καθοδήγηση και εκπαίδευση του προσωπικού για την εφαρμογή αποτελεσματικών τεχνικών πωλήσεων και διαχείρισης πελατών.\"},{\"kind\":\"li\",\"text\":\"Ανάπτυξη και διαχείριση συνεργασιών με κύριους προμηθευτές και πελάτες για την επίτευξη εμπορικών στόχων.\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με τους υπευθύνους έκδοσης τεχνικής τεκμηρίωσης για τους πελάτες, με στόχο την πιστοποίηση της αξιοπιστίας, της ασφάλειας και της εγγύησης των προϊόντων της εταιρείας, σε συμμόρφωση με τις πολιτικές της εταιρείας.\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με τους υπευθύνους ανάπτυξης διαδικασιών και προτύπων ποιότητας της εταιρείας, πιστοποίησης τεχνολογικών διαδικασιών και διαδικασιών, καταλληλότητας προϊόντων και επίβλεψης δοκιμών, στο πλαίσιο των στόχων που τίθενται για τη λειτουργία QA.\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται στενά με άλλες ομάδες (έμμεσα εμπλεκόμενες) για την διασφάλιση και τήρηση των προτύπων ασφάλειας και ποιότητας\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει εκθέσεις ενημέρωσης της διοίκησης σχετικά με δείκτες παρακολούθησης των δράσεων Marketing κτλ.\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί στενά την στοχοθεσία των υφισταμένων παρακολουθώντας τους δείκτες προόδου των εργασιών (KPIs/objectives)\"},{\"kind\":\"li\",\"text\":\"Παρέχει καθοδήγηση αλλά και ελέγχει τους τομεάρχες για τις αρμοδιότητες και το παραγόμενο έργο\"},{\"kind\":\"li\",\"text\":\"Παρακινεί, καθοδηγεί και εμψυχώνει τους ανθρώπους και συνδράμει στην κουλτούρα συνεργασίας και καλού εργασιακού κλίματος\"},{\"kind\":\"li\",\"text\":\"Επιλύει ζητήματα παρανοήσεων ή συγκρούσεων που προκύψουν εντός της μονάδας\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει εκπροσωπώντας την επιχείρηση σε κλαδικές συναντήσεις\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί το τμήμα αγορών. (προς συζήτηση)\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με Γενικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται καθημερινά με το γενικό διευθυντή για τρέχοντα θέματα εργασιών\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει σε συνεργασία με τον Γ.Δ. & Δ/ντη Παραγωγής και τους τομεάρχες το πλανόγραμμα και τους προϋπολογισμούς (σε χρόνους εργασιών)\"},{\"kind\":\"li\",\"text\":\"Παρέχει έγκυρες και εντός χρονικών ορίων πληροφορίες για θέματα μείζονος σημασίας (αστοχίες υλικών κ.α.)\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει σε θεσμοθετημένες τμηματικές και δια-τμηματικές συσκέψεις διατηρώντας ουσιαστικό και κρίσιμο ρόλο\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται καθημερινά με τους προϊσταμένους τμημάτων (π.χ. τεχνικό, προμηθειών, εφοδιαστικής αλυσίδας κτλ. για όλη την γκάμα θεμάτων που αφορούν τις παραγγελίες υλοποίησης παραγωγής)\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος:\"},{\"kind\":\"li\",\"text\":\"Οργάνωση /προγραμματισμός και τήρηση χρονοδιαγραμμάτων\"},{\"kind\":\"li\",\"text\":\"Επικοινωνία και ενεργητική ακρόαση\"},{\"kind\":\"li\",\"text\":\"Ακρίβεια, συνέπεια, μεθοδικότητα\"},{\"kind\":\"li\",\"text\":\"Προσαρμοστικότητα σε μεταβαλλόμενες συνθήκες αγοράς\"},{\"kind\":\"li\",\"text\":\"Ομαδικότητα και συνεργασία με ομάδες\"},{\"kind\":\"li\",\"text\":\"Ανάληψη πρωτοβουλιών\"},{\"kind\":\"li\",\"text\":\"Ικανότητα διοίκησης ανθρώπων (Ηγεσία)\"},{\"kind\":\"li\",\"text\":\"Ικανότητα ανάθεσης εργασιών\"},{\"kind\":\"li\",\"text\":\"Αναλυτική σκέψη και κριτική ικανότητα\"},{\"kind\":\"li\",\"text\":\"Γνώση σε χρηματοοικονομική ανάλυση και κατάρτιση προϋπολογισμού, για την επίβλεψη εσόδων και κερδοφορίας\"},{\"kind\":\"li\",\"text\":\"Καλό επίπεδο τεχνογνωσίας και βασικών εφαρμογών του κλάδου\"},{\"kind\":\"li\",\"text\":\"Διάθεση για μάθηση\"},{\"kind\":\"li\",\"text\":\"Προσανατολισμός στο ποιοτικό τελικό αποτέλεσμα\"},{\"kind\":\"li\",\"text\":\"Διαχείριση στρες\"},{\"kind\":\"li\",\"text\":\"Αποφασιστικότητα\"},{\"kind\":\"li\",\"text\":\"Ενσυναίσθηση\"},{\"kind\":\"li\",\"text\":\"Εντιμότητα - αξιοπιστία - φερεγγυότητα\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Παραγγελίες\",\"Δ/ντη Εμπορικών σχέσεων (Commercial Director)\",\"Τεχνικό Δ/ντη και Διευθυντές σε συνεργασία με Γ.Δ.(Technical Director, Managing Director)\",\"Τακτικά\"],[\"Καταστάσεις εργαζομένων\",\"Δ/ντη Εμπορικών Σχέσεων (Commercial Director)\",\"Δ/ντη HR (HR Director)\",\"Τακτικά\"]]},{\"kind\":\"table\",\"head\":[\"Αναφορές που δέχεται\"],\"body\":[[\"Πλανόγραμμα υλοποίησης παραγγελιών\",\"Δ/ντη Λειτουργιών (Operations Director)\",\"Δ/ντη Εμπορικών Σχέσεων (Commercial Director)\",\"Μηνιαία\"],[\"Αναφορά οικονομικής απόδοσης από έσοδα ανά πελάτη / ανά κλάδο\",\"Finance Manager\",\"Δ/ντη Εμπορικών Σχέσεων (Commercial Director)\",\"Μηνιαία\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Ανασκόπηση Απόδοσης Πωλήσεων & Marketing\",\"Commercial Director, Sales Manager, Marketing Associate\",\"Μηνιαία\",\"Στόχοι, δείκτες, στρατηγικές διορθώσεις\"],[\"Ετήσια Σύσκεψη Στρατηγικού Σχεδιασμού\",\"Γενικός Διευθυντής, Plant Director, Finance Manager\",\"Ετήσια\",\"Ευθυγράμμιση εμπορικής στρατηγικής με παραγωγική δυναμικότητα και προϋπολογισμό\"],[\"Σύσκεψη με Βασικό Πελάτη\",\"Εκπρόσωπος βασικού πελάτη (εξωτερικός), Commercial Director, Sales Manager\",\"Κατά περίπτωση\",\"Διαχείριση στρατηγικής σχέσης με σημαντικό πελατολόγιο\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"Σύστημα παρακολούθησης της αγοράς (Market Monitoring System, Executive Sales Dashboard σε Power BI, συνδεδεμένο με το ERP)\"},{\"kind\":\"li\",\"text\":\"Σύστημα παρακολούθησης πελατών (Customer Monitoring System, CRM Dashboard σύνοψης του pipeline, ποσοστό μετατροπής, ρυθμός εξέλιξης πελατών)\"},{\"kind\":\"li\",\"text\":\"Marketing Performance Monitoring System (Marketing-to-Sales Funnel Dashboard)\"},{\"kind\":\"li\",\"text\":\"MS Office (Word, Excel, PowerPoint, Outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο τεχνικών επιστημών, διοίκησης επιχειρήσεων, Marketing, ή συναφές αντικείμενο\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος θεωρείται επιπλέον προσόν (MSC, MBA)\"},{\"kind\":\"li\",\"text\":\"Εκπληρωμένες στρατιωτικές υποχρεώσεις\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Αύξηση Εσόδων (Revenue Growth)\"},{\"kind\":\"li\",\"text\":\"Περιθώριο Μικτού Κέρδους (Gross Margin)\"},{\"kind\":\"li\",\"text\":\"Δείκτης Ικανοποίησης Πελατών (Customer Satisfaction - CSAT)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Διακράτησης Πελατών (Customer Retention Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Απώλειας Πελατών (Customer Churn Rate\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 15+ ετών σε τμήματα βιομηχανικής παραγωγής, εκ των οποίων 10 έτη σε προϊσταμενική θέση τομέα\"}],\"children\":[4],\"depth\":2},{\"id\":\"r4\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Sales Manager\",\"short\":\"Sales Manager\",\"reportsTo\":\"Διευθυντή Εμπορικής Στρατηγικής, Εμπορικών Σχέσεων και Μάρκετινγκ\",\"parent\":3,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό τον καθημερινό συντονισμό και τη διαχείριση της ομάδας πωλήσεων με βάση την εμπορική στρατηγική για τη διασφάλιση της επίτευξης των στόχων πωλήσεων ανά τομέα (Marine, Land/Industry, Defence & Aerospace, εξωτερικό). Στις υπευθυνότητές του εμπίπτει η προετοιμασία προσφορών και εξυπηρέτησης παραγγελιών με βάση το εμπορικό πλάνο καθώς και την ευθυγράμμιση των ενεργειών του Marketing. Υποστηρίζει τον Διευθυντή Εμπορικής Στρατηγικής.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Marketing Associate, Costing & Preparation Assistant, Commercial Follow Up, Marine Sales Engineer, Land/Industry Sales Engineer, Head of Business Development Overseas, Defence & Aerospace Sales Engineer, Agents/Representatives\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Οργανώνει και κατανέμει καθημερινά τις εργασίες της ομάδας πωλήσεων ανά τομέα δραστηριότητας (Marine, Land/Industry, Defence & Aerospace, Head of Business Development Overseas)\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί στενά την απόδοση κάθε μέλους της ομάδας μέσω δεικτών προόδου (KPIs) και καθορίζει ατομικούς και ομαδικούς στόχους\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει προβλέψεις πωλήσεων (sales forecasting) ανά τομέα αγορών και δραστηριότητας ως βάση για τον καθορισμό στόχων\"},{\"kind\":\"li\",\"text\":\"Συντονίζει τον Marketing Associate ώστε οι ενέργειες Marketing και οι δυνητικοί πελάτες (leads) που εισάγονται να ευθυγραμμίζονται με τις ανάγκες και τις προτεραιότητες της ομάδας πωλήσεων\"},{\"kind\":\"li\",\"text\":\"Επιβλέπει τη λειτουργία Costing & Preparation, διασφαλίζοντας την έγκαιρη και ακριβή προετοιμασία προσφορών\"},{\"kind\":\"li\",\"text\":\"Επιβλέπει το Commercial Follow Up για την ομαλή διεκπεραίωση παραγγελιών μετά την πώληση\"},{\"kind\":\"li\",\"text\":\"Διαχειρίζεται τις σχέσεις με Agents/Representatives σε αγορές του εξωτερικού\"},{\"kind\":\"li\",\"text\":\"Υποστηρίζει τον Head of Business Development Overseas στην ανάπτυξη νέων διεθνών αγορών\"},{\"kind\":\"li\",\"text\":\"Αναλύει δεδομένα πωλήσεων (όγκος, περιθώριο, νέες παραγγελίες, χαμένες ευκαιρίες) και προετοιμάζει τακτικές αναφορές προς τον Εμπορικό Διευθυντή.\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στη διαμόρφωση τιμολογιακής πολιτικής σε συνεργασία με τον Commercial Director\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει ευκαιρίες αγοράς και προτείνει ενέργειες ανάπτυξης πελατολογίου\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει τη συμμόρφωση της ομάδας με τις εμπορικές πολιτικές και διαδικασίες της εταιρείας\"},{\"kind\":\"li\",\"text\":\"Εκπαιδεύει, καθοδηγεί και εντάσσει νέα μέλη στην ομάδα πωλήσεων\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στον καθορισμό ανάπτυξης και δομής της ομάδας του εμπορικού τμήματος σε συνεργασία με τον Εμπορικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στη διαδικασία πρόσληψης και επιλογής νέων μελών της ομάδας πωλήσεων\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Εμπορικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την πορεία πωλήσεων, την επίτευξη στόχων και τυχόν εμπόδια\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει κατεύθυνση για τη στρατηγική πωλήσεων, την τιμολόγηση και τις προτεραιότητες αγορών\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει στη διαμόρφωση του ετήσιου πλάνου εμπορικής ανάπτυξης\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τεχνικό τμήμα για τις τεχνικές προδιαγραφές που συνοδεύουν τις προσφορές\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με την παραγωγή/εφοδιαστική αλυσίδα για τ \"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 1-3 ετών σε κοστολόγηση ή προετοιμασία προσφορών σε βιομηχανικό περιβάλλον, κατά προτίμηση κατασκευής κατά παραγγελία (engineer-to-order)\"}],\"children\":[],\"depth\":4},{\"id\":\"r7\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Commercial Follow up Assistant\",\"short\":\"Commercial Follow up Assistant\",\"reportsTo\":\"Sales Manager\",\"parent\":4,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την παρακολούθηση κάθε προσφοράς και παραγγελίας από τη στιγμή αποστολής της προσφοράς έως την ολοκλήρωση της παράδοσης, διασφαλίζοντας την ομαλή διεκπεραίωση των εμπορικών όρων, της τεκμηρίωσης εξαγωγών και της επικοινωνίας με τον πελάτη.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί την πορεία της προσφοράς έως τη μετατροπή της σε παραγγελία και ενημερώνει τον Sales Manager\"},{\"kind\":\"li\",\"text\":\"Διατηρεί τακτική επικοινωνία με τον πελάτη μετά την αποστολή της προσφοράς, απαντώντας σε διευκρινιστικά ερωτήματα και υπενθυμίζοντας εκκρεμότητες\"},{\"kind\":\"li\",\"text\":\"Καταχωρεί και παρακολουθεί την παραγγελία στο σύστημα από την επιβεβαίωσή της έως την παράδοση\"},{\"kind\":\"li\",\"text\":\"Συντονίζεται με το τεχνικό τμήμα και την παραγωγή για την επιβεβαίωση χρόνων παράδοσης και ενημερώνει τον πελάτη για την πρόοδο\"},{\"kind\":\"li\",\"text\":\"Επαληθεύει τους συμφωνημένους όρους παράδοσης για κάθε παραγγελία και διασφαλίζει τη συνέπειά τους με τα έγγραφα εξαγωγής\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί σε συνεργασία με το οικονομικό τμήμα την εξέλιξη της παραγγελίας μέχρι την ολοκλήρωσή της\"},{\"kind\":\"li\",\"text\":\"Ελέγχει ότι τα έγγραφα αποστολής συμφωνούν με τους όρους της πίστωσης\"},{\"kind\":\"li\",\"text\":\"Συγκεντρώνει τα απαραίτητα έγγραφα εξαγωγής από την παραγωγή, αποθήκη και το οικονομικό τμήμα (π.χ., εμπορικό τιμολόγιο, packing list, πιστοποιητικό καταγωγής, φορτωτική)\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τους Agents / Representatives στο εξωτερικό για την κατάσταση των παραγγελιών των πελατών τους\"},{\"kind\":\"li\",\"text\":\"Καταγράφει και συντονίζει την επίλυση προβλημάτων παράδοσης ή παραπόνων πελατών, τροφοδοτώντας τον Sales Manager\"},{\"kind\":\"li\",\"text\":\"Τηρεί αρχείο ιστορικού παραγγελιών ανά πελάτη προς υποστήριξη μελλοντικών προσφορών\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τον Sales Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τακτικά για την κατάσταση παραγγελιών σε εξέλιξη και τυχόν καθυστερήσεις ή προβλήματα\"},{\"kind\":\"li\",\"text\":\"Λαμβάνει κατεύθυνση για προτεραιότητες σε περιπτώσεις καθυστερήσεων ή διαφωνιών με πελάτες\"},{\"kind\":\"li\",\"text\":\"Εισηγείται βελτιώσεις στη διαδικασία παρακολούθησης παραγγελιών\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το Costing & Preparation για τη μεταφορά της προσφοράς σε παραγγελία με τους σωστούς όρους\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με την παραγωγή και την εφοδιαστική αλυσίδα για τους χρόνους παράδοσης\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το οικονομικό τμήμα για την τιμολόγηση και την παρακολούθηση πληρωμών/ενέγγυων πιστώσεων\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με τους Sales Engineers και τους Agents/Representatives για την ενημέρωση πελατών\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος\"},{\"kind\":\"li\",\"text\":\"Οργάνωση και συνέπεια στην παρακολούθηση εκκρεμοτήτων\"},{\"kind\":\"li\",\"text\":\"Προσοχή στη λεπτομέρεια, ιδίως σε έγγραφα εξαγωγών\"},{\"kind\":\"li\",\"text\":\"Επικοινωνιακές ικανότητες και προσανατολισμός στην εξυπηρέτηση πελατών\"},{\"kind\":\"li\",\"text\":\"Διαχείριση δύσκολων ή απαιτητικών αλληλεπιδράσεων με πελάτες\"},{\"kind\":\"li\",\"text\":\"Ψυχραιμία σε καταστάσεις καθυστερήσεων ή πίεσης\"},{\"kind\":\"li\",\"text\":\"Ανθεκτικότητα και Προσαρμοστικότητα\"},{\"kind\":\"li\",\"text\":\"Αξιοπιστία και συνέπεια στην τήρηση δεσμεύσεων προς τον πελάτη\"},{\"kind\":\"li\",\"text\":\"Ικανότητα διαχείρισης πολλών παράλληλων παραγγελιών\"},{\"kind\":\"li\",\"text\":\"Γνώση Incoterms και όρων παράδοσης\"},{\"kind\":\"li\",\"text\":\"Γνώση διαδικασίας ενέγγυας πίστωσης και απαιτούμενων εγγράφων εξαγωγής\"},{\"kind\":\"li\",\"text\":\"Γνώση προϊόντος και διαδικασιών παραγγελίας, ώστε η ενημέρωση προς τον πελάτη να είναι ακριβής και επίκαιρη\"},{\"kind\":\"li\",\"text\":\"Γνώση ERP, CRM\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Κατάσταση παραγγελιών σε εξέλιξη\",\"Commercial Follow up Assistant\",\"Sales Managers\",\"Τακτικά\"],[\"Αναφορά καθυστερήσεων ή προβλημάτων παράδοσης\",\"Commercial Follow up Assistant\",\"Sales Managers\",\"Τακτικά\"]]},{\"kind\":\"table\",\"head\":[\"Αναφορές που δέχεται\"],\"body\":[[\"Επιβεβαιωμένοι Χρόνοι παράδοσης\",\"Τεχνικό Τμήμα\",\"Commercial Follow up Assistant\",\"Τακτικά\"],[\"Στοιχεία εμπορικού παραστατικού/τιμολόγησης για έγγραφα εξαγωγής\",\"Accounting & Tax Controller\",\"Commercial Follow up Assistant\",\"Ανά παραγγελία\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Σύσκεψη παρακολούθησης παραγγελιών\",\"Sales Manager, Commercial Follow up Assistant, Plant Manager\",\"Εβδομαδιαία\",\"Χρόνοι παράδοσης, εκκρεμότητες\"],[\"Σύσκεψη Εξαγωγικής Τεκμηρίωσης\",\"Accounting & Tax Controller, εξωτερικός μεταφορέας/freight forwarder\",\"Κατά περίπτωση\",\"Έγγραφα LC/Incoterms\"]]},{\"kind\":\"h\",\"text\":\"Χρήση Συστημάτων\"},{\"kind\":\"li\",\"text\":\"Σύστημα διαχείρισης παραγγελιών (Order Management) / ERP\"},{\"kind\":\"li\",\"text\":\"CRM για ιστορικό πελατών\"},{\"kind\":\"li\",\"text\":\"Σύστημα παρακολούθησης φορτώσεων και μεταφορών\"},{\"kind\":\"li\",\"text\":\"MS Office (Word, Excel, PowerPoint, Outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Διοίκησης Επιχειρήσεων, Διεθνούς Εμπορίου ή συναφούς αντικειμένου\"},{\"kind\":\"li\",\"text\":\"Γνώση διαδικασιών εξαγωγών, Incoterms και ενέγγυων πιστώσεων επιθυμητή\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office, ERP)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά, δεύτερη ξένη γλώσσα επιθυμητή\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Έγκαιρη & Πλήρης Παράδοση (On Time In Full-OTIF)\"},{\"kind\":\"li\",\"text\":\"Ακρίβεια Εγγράφων Αποστολής/Εξαγωγής (Documentation Accuracy Rate)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 1-3 ετών σε εξυπηρέτηση πελατών ή διαχείριση παραγγελιών σε βιομηχανικό ή εξαγωγικό περιβάλλον\"}],\"children\":[],\"depth\":4},{\"id\":\"r8\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Marine Sales Engineer\",\"short\":\"Marine Sales Engineer\",\"reportsTo\":\"Sales Manager\",\"parent\":4,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Γενικός Σκοπός του Ρόλου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την ανάπτυξη πωλήσεων των προϊόντων της εταιρείας, συνδυάζοντας τεχνική γνώση των απαιτήσεων και προτύπων του κλάδου με εμπορική ικανότητα, ώστε οι προσφορές να πληρούν τις τεχνικές και κανονιστικές απαιτήσεις κάθε παραγγελίας και τις ανάγκες κάθε πελάτη.\"},{\"kind\":\"h\",\"text\":\"Ο γενικός αυτός σκοπός εξειδικεύεται σε τρεις επιμέρους τεχνικούς τομείς, καθένας με τις δικές του κανονιστικές και τεχνικές απαιτήσεις\"},{\"kind\":\"p\",\"text\":\"Marine, Land/Industry και Defence & Aerospace. Οι κύριες δραστηριότητες ανά τομέα αναλύονται παρακάτω:\"},{\"kind\":\"h\",\"text\":\"Α. Κύρια Καθήκοντα – Δραστηριότητες - Marine Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε ναυπηγεία, πλοιοκτήτριες εταιρείες και κατασκευαστές ναυτιλιακού εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (ψύξη κινητήρα, θέρμανση καυσίμου, HVAC πλοίου, ή εξειδικευμένες εφαρμογές όπως δεξαμενόπλοια LNG) και μεταφέρει τις προδιαγραφές στο τεχνικό τμήμα και στο Costing & Preparation\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις απαιτήσεις πιστοποίησης (Type Approval) των νηογνωμόνων (DNV, Lloyd's Register, ABS, Bureau Veritas, ClassNK) που ισχύουν για κάθε παραγγελία και διασφαλίζει ότι αντικατοπτρίζονται στην προσφορά\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τεχνικό τμήμα για τη διασφάλιση συμμόρφωσης με την Ευρωπαϊκή Marine Equipment Directive (MED), όπου απαιτείται\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και παρουσιάζει τεχνικές προτάσεις σε πελάτες του ναυτιλιακού κλάδου\"},{\"kind\":\"li\",\"text\":\"Παρέχει τεχνική υποστήριξη στον πελάτη κατά τη διαδικασία πώλησης\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις της ναυτιλιακής αγοράς (νέες κατασκευές, ανανέωση στόλου, κανονισμοί) και εντοπίζει ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εμπορικούς αντιπροσώπους (Agents / Representatives) σε ξένες αγορές για ευκαιρίες στον ναυτιλιακό τομέα\"},{\"kind\":\"li\",\"text\":\"Διαπραγματεύεται εμπορικούς όρους εντός των ορίων που έχει καθορίσει ο Sales Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τον Sales Manager για την πρόοδο ευκαιριών και προσφορών του κλάδου\"},{\"kind\":\"h\",\"text\":\"Β. Κύρια Καθήκοντα – Δραστηριότητες – Land/Industry Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε εταιρείες πετρελαίου & φυσικού αερίου, πετροχημικών, ενεργειακής παραγωγής και χημικής βιομηχανίας\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (θερμοκρασίες, πιέσεις, υλικά, χωρητικότητα) και μεταφέρει τις προδιαγραφές στο τεχνικό τμήμα και στο Costing & Preparation.\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει ότι οι προσφορές συμμορφώνονται με τα βιομηχανικά πρότυπα κατασκευής (TEMA, ASME) που ισχύουν για κάθε παραγγελία\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και παρουσιάζει τεχνικές προτάσεις σε βιομηχανικούς πελάτες\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις της βιομηχανικής αγοράς (νέες επενδύσεις, επεκτάσεις μονάδων, κανονισμοί) και εντοπίζει ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εμπορικούς αντιπροσώπους (Agents / Representatives) σε ξένες αγορές για ευκαιρίες στον βιομηχανικό τομέα\"},{\"kind\":\"li\",\"text\":\"Διαπραγματεύεται εμπορικούς όρους εντός των ορίων που έχει καθορίσει ο Sales Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τον Sales Manager για την πρόοδο ευκαιριών και προσφορών του κλάδου\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες – Defence & Aerospace Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε φορείς άμυνας, ναυπηγεία πολεμικών πλοίων και κατασκευαστές αεροσκαφών\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις εξειδικευμένες τεχνικές απαιτήσεις της εφαρμογής (αντοχή σε κραδασμούς, βάρος, αξιοπιστία υπό ακραίες συνθήκες) και μεταφέρει τις προδιαγραφές στο τεχνικό τμήμα και στο Costing & Preparation\"},{\"kind\":\"li\",\"text\":\"Διασφαλίζει ότι οι προσφορές συμμορφώνονται με στρατιωτικές προδιαγραφές και πρότυπα ασφαλείας που ισχύουν για κάθε παραγγελία\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και παρουσιάζει τεχνικές προτάσεις σε πελάτες του αμυντικού και αεροδιαστημικού κλάδου\"},{\"kind\":\"li\",\"text\":\"Παρέχει τεχνική υποστήριξη στον πελάτη κατά τη διαδικασία πώλησης\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις της αγοράς άμυνας και αεροδιαστημικής (αμυντικοί προϋπολογισμοί, εκσυγχρονισμός στόλου/εξοπλισμού) και εντοπίζει ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εμπορικούς αντιπροσώπους (Agents ένου\"},{\"kind\":\"li\",\"text\":\"Γνώση προτύπων βιομηχανικών προτύπων κατασκευής\"},{\"kind\":\"li\",\"text\":\"Γνώση στρατιωτικών προδιαγραφών και προτύπων ασφαλείας\"},{\"kind\":\"li\",\"text\":\"Γνώση κανονισμών ελέγχου εξαγωγών αμυντικού υλικού\"},{\"kind\":\"li\",\"text\":\"Πιστοποίηση στις τεχνικές πωλήσεων θα αξιολογηθεί θετικά\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office, ERP)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά, δεύτερη ξένη γλώσσα επιθυμητή\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Τεχνικό Ποσοστό Επιτυχίας (Technical Win Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Επαναλαμβανόμενων Παραγγελιών από Υπάρχοντες Πελάτες (Repeat Order Rate)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5+ ετών σε τεχνικές πωλήσεις βιομηχανικού εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Διαφοροποιημένη προτιμώμενη εστίαση ανά κλάδο.\"}],\"children\":[],\"depth\":4},{\"id\":\"r9\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Land / Industry Sales Engineer\",\"short\":\"Land / Industry Sales Engineer\",\"reportsTo\":\"Sales Manager\",\"parent\":4,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Γενικός Σκοπός του Ρόλου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την ανάπτυξη πωλήσεων των προϊόντων της εταιρείας, συνδυάζοντας τεχνική γνώση των απαιτήσεων και προτύπων του κλάδου με εμπορική ικανότητα, ώστε οι προσφορές να πληρούν τις τεχνικές και κανονιστικές απαιτήσεις κάθε παραγγελίας και τις ανάγκες κάθε πελάτη.\"},{\"kind\":\"h\",\"text\":\"Ο γενικός αυτός σκοπός εξειδικεύεται σε τρεις επιμέρους τεχνικούς τομείς, καθένας με τις δικές του κανονιστικές και τεχνικές απαιτήσεις\"},{\"kind\":\"p\",\"text\":\"Marine, Land/Industry και Defence & Aerospace. Οι κύριες δραστηριότητες ανά τομέα αναλύονται παρακάτω:\"},{\"kind\":\"h\",\"text\":\"Α. Κύρια Καθήκοντα – Δραστηριότητες - Marine Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε ναυπηγεία, πλοιοκτήτριες εταιρείες και κατασκευαστές ναυτιλιακού εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (ψύξη κινητήρα, θέρμανση καυσίμου, HVAC πλοίου, ή εξειδικευμένες εφαρμογές όπως δεξαμενόπλοια LNG) και μεταφέρει τις προδιαγραφές στο τεχνικό τμήμα και στο Costing & Preparation\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις απαιτήσεις πιστοποίησης (Type Approval) των νηογνωμόνων (DNV, Lloyd's Register, ABS, Bureau Veritas, ClassNK) που ισχύουν για κάθε παραγγελία και διασφαλίζει ότι αντικατοπτρίζονται στην προσφορά\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τεχνικό τμήμα για τη διασφάλιση συμμόρφωσης με την Ευρωπαϊκή Marine Equipment Directive (MED), όπου απαιτείται\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και παρουσιάζει τεχνικές προτάσεις σε πελάτες του ναυτιλιακού κλάδου\"},{\"kind\":\"li\",\"text\":\"Παρέχει τεχνική υποστήριξη στον πελάτη κατά τη διαδικασία πώλησης\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις της ναυτιλιακής αγοράς (νέες κατασκευές, ανανέωση στόλου, κανονισμοί) και εντοπίζει ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εμπορικούς αντιπροσώπους (Agents / Representatives) σε ξένες αγορές για ευκαιρίες στον ναυτιλιακό τομέα\"},{\"kind\":\"li\",\"text\":\"Διαπραγματεύεται εμπορικούς όρους εντός των ορίων που έχει καθορίσει ο Sales Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τον Sales Manager για την πρόοδο ευκαιριών και προσφορών του κλάδου\"},{\"kind\":\"h\",\"text\":\"Β. Κύρια Καθήκοντα – Δραστηριότητες – Land/Industry Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε εταιρείες πετρελαίου & φυσικού αερίου, πετροχημικών, ενεργειακής παραγωγής και χημικής βιομηχανίας\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (θερμοκρασίες, πιέσεις, υλικά, χωρητικότητα) και μεταφέρει τις προδιαγραφές στο :\"li\",\"text\":\"Γνώση προτύπων βιομηχανικών προτύπων κατασκευής\"},{\"kind\":\"li\",\"text\":\"Γνώση στρατιωτικών προδιαγραφών και προτύπων ασφαλείας\"},{\"kind\":\"li\",\"text\":\"Γνώση κανονισμών ελέγχου εξαγωγών αμυντικού υλικού\"},{\"kind\":\"li\",\"text\":\"Πιστοποίηση στις τεχνικές πωλήσεων θα αξιολογηθεί θετικά\"},{\"kind\":\"li\",\"text\":\"Γνώση Η/Υ (MS Office, ERP)\"},{\"kind\":\"li\",\"text\":\"Ξένες γλώσσες: Αγγλικά, δεύτερη ξένη γλώσσα επιθυμητή\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Τεχνικό Ποσοστό Επιτυχίας (Technical Win Rate)\"},{\"kind\":\"li\",\"text\":\"Ποσοστό Επαναλαμβανόμενων Παραγγελιών από Υπάρχοντες Πελάτες (Repeat Order Rate)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5+ ετών σε τεχνικές πωλήσεις βιομηχανικού εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Διαφοροποιημένη προτιμώμενη εστίαση ανά κλάδο.\"}],\"children\":[],\"depth\":4},{\"id\":\"r10\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Defence & Aerospace Sales Engineer\",\"short\":\"Defence & Aerospace Sales Engineer\",\"reportsTo\":\"Sales Manager\",\"parent\":4,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Γενικός Σκοπός του Ρόλου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την ανάπτυξη πωλήσεων των προϊόντων της εταιρείας, συνδυάζοντας τεχνική γνώση των απαιτήσεων και προτύπων του κλάδου με εμπορική ικανότητα, ώστε οι προσφορές να πληρούν τις τεχνικές και κανονιστικές απαιτήσεις κάθε παραγγελίας και τις ανάγκες κάθε πελάτη.\"},{\"kind\":\"h\",\"text\":\"Ο γενικός αυτός σκοπός εξειδικεύεται σε τρεις επιμέρους τεχνικούς τομείς, καθένας με τις δικές του κανονιστικές και τεχνικές απαιτήσεις\"},{\"kind\":\"p\",\"text\":\"Marine, Land/Industry και Defence & Aerospace. Οι κύριες δραστηριότητες ανά τομέα αναλύονται παρακάτω:\"},{\"kind\":\"h\",\"text\":\"Α. Κύρια Καθήκοντα – Δραστηριότητες - Marine Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε ναυπηγεία, πλοιοκτήτριες εταιρείες και κατασκευαστές ναυτιλιακού εξοπλισμού\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (ψύξη κινητήρα, θέρμανση καυσίμου, HVAC πλοίου, ή εξειδικευμένες εφαρμογές όπως δεξαμενόπλοια LNG) και μεταφέρει τις προδιαγραφές στο τεχνικό τμήμα και στο Costing & Preparation\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις απαιτήσεις πιστοποίησης (Type Approval) των νηογνωμόνων (DNV, Lloyd's Register, ABS, Bureau Veritas, ClassNK) που ισχύουν για κάθε παραγγελία και διασφαλίζει ότι αντικατοπτρίζονται στην προσφορά\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με το τεχνικό τμήμα για τη διασφάλιση συμμόρφωσης με την Ευρωπαϊκή Marine Equipment Directive (MED), όπου απαιτείται\"},{\"kind\":\"li\",\"text\":\"Προετοιμάζει και παρουσιάζει τεχνικές προτάσεις σε πελάτες του ναυτιλιακού κλάδου\"},{\"kind\":\"li\",\"text\":\"Παρέχει τεχνική υποστήριξη στον πελάτη κατά τη διαδικασία πώλησης\"},{\"kind\":\"li\",\"text\":\"Παρακολουθεί τις εξελίξεις της ναυτιλιακής αγοράς (νέες κατασκευές, ανανέωση στόλου, κανονισμοί) και εντοπίζει ευκαιρίες\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται με εμπορικούς αντιπροσώπους (Agents / Representatives) σε ξένες αγορές για ευκαιρίες στον ναυτιλιακό τομέα\"},{\"kind\":\"li\",\"text\":\"Διαπραγματεύεται εμπορικούς όρους εντός των ορίων που έχει καθορίσει ο Sales Manager\"},{\"kind\":\"li\",\"text\":\"Ενημερώνει τον Sales Manager για την πρόοδο ευκαιριών και προσφορών του κλάδου\"},{\"kind\":\"h\",\"text\":\"Β. Κύρια Καθήκοντα – Δραστηριότητες – Land/Industry Sales Engineer\"},{\"kind\":\"li\",\"text\":\"Εντοπίζει και αναπτύσσει ευκαιρίες πωλήσεων σε εταιρείες πετρελαίου & φυσικού αερίου, πετροχημικών, ενεργειακής παραγωγής και χημικής βιομηχανίας\"},{\"kind\":\"li\",\"text\":\"Συζητά με τον πελάτη τις τεχνικές απαιτήσεις της εφαρμογής (θερμοκρασίες, πιέσεις, υλικά, χωρητικότητα) και μεταφέρει τις προδιαγραφές στο τεχνικό όχοι\"],[\"Ανασκόπηση Νέων Αγορών\",\"Sales Manager, Head of Business Development Overseas\",\"Μηνιαία\",\"Πρόοδος διείσδυσης\"]]},{\"kind\":\"h\",\"text\":\"Χρήση Συστημάτων\"},{\"kind\":\"li\",\"text\":\"CRM για παρακολούθηση ευκαιριών και διαχείριση εμπορικών αντιπροσώπων\"},{\"kind\":\"li\",\"text\":\"Εργαλεία έρευνας αγοράς και ανταγωνισμού\"},{\"kind\":\"li\",\"text\":\"MS Office (Word, Excel, PowerPoint, Outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Διεθνούς Εμπορίου, Marketing/Πωλήσεων, Διοίκησης Επιχειρήσεων ή συναφούς αντικειμένου\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακό σε συναφές αντικείμενο με έμφαση στο Διεθνές Εμπόριο, International Business Development, Διεθνές Marketing και Στρατηγική Διοίκηση.\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση Αγγλικών και γνώση δεύτερης ξένης γλώσσας\"},{\"kind\":\"li\",\"text\":\"Γνώση CRM και εργαλείων έρευνας αγοράς\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Διείσδυση σε Νέες Αγορές (New Market Penetration)\"},{\"kind\":\"li\",\"text\":\"Έσοδα από Νέες Αγορές (Revenue from New Markets)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 3-5+ ετών σε διεθνή ανάπτυξη επιχειρήσεων ή εξαγωγικές πωλήσεις, κατά προτίμηση σε βιομηχανικό κλάδο\"}],\"children\":[],\"depth\":4},{\"id\":\"r12\",\"dept\":\"Εμπορική Διεύθυνση\",\"title\":\"Εμπορικοί Αντιπρόσωποι (Agents/Representatives)\",\"short\":\"Εμπορικοί Αντιπρόσωποι\",\"reportsTo\":\"Sales Manager Οι εμπορικοί αντιπρόσωποι συνεργάζονται με την εταιρεία σε αγορές του εξωτερικού βάσει σύμβασης αντιπροσωπείας. Ανάλογα με τους όρους της συμφωνίας, μπορούν είτε να διαπραγματεύονται πωλήσεις για λογαριασμό της είτε να έχουν και την εξουσία να τις συνάπτουν εξ ονόματός της.\",\"parent\":4,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος έχει ως σκοπό την ανάδειξη της εμπορικής παρουσίας της εταιρείας σε τοπικές και διεθνείς αγορές, αναπτύσσοντας δυναμικά το δίκτυο των της εταιρείας και της ανάπτυξης του πελατολογίου της.\"}],\"children\":[],\"depth\":4},{\"id\":\"r13\",\"dept\":\"Διεύθυνση Λειτουργιών & Οικονομικών Υπηρεσιών\",\"title\":\"Διευθυντής Λειτουργιών και Οικονομική Διεύθυνση (Operations Director)\",\"short\":\"Operations Director\",\"reportsTo\":\"Γενική Διεύθυνση (Διευθύνοντα Σύμβουλο ή/και Διοικητικό Συμβούλιο)\",\"parent\":1,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Ο ρόλος αποτελεί βασικό παράγοντα για τη βιώσιμη ανάπτυξη και την επιχειρησιακή αριστεία της εταιρείας. Ο Διευθυντής Λειτουργιών είναι υπεύθυνος/η για τον σχεδιασμό, την οργάνωση, τον συντονισμό και τη βελτιστοποίηση όλων των επιχειρησιακών λειτουργιών της εταιρείας. Διασφαλίζει την εύρυθμη λειτουργία των τμημάτων, την επίτευξη των στρατηγικών στόχων, την αποτελεσματική διαχείριση των πόρων και την υλοποίηση των επιχειρησιακών πλάνων σύμφωνα με το όραμα και τη στρατηγική της Διοίκησης. Είναι επίσης υπεύθυνος για την αποτίμηση των πόρων της εταιρείας και την αποτελεσματική διαχείριση των χρηματοοικονομικών παραμέτρων. Είναι ο ρόλος που θα στηρίξει την μετάβαση της εταιρείας στη νέα της λειτουργική πραγματικότητα.\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Υπεύθυνος Οικονομικού τμήματος, Υπεύθυνος Αγορών, Προϊστάμενος Αποθήκης και Logistics, Υπεύθυνος Ανθρώπινου Δυναμικού, Προϊστάμενος Διοικητικής Υποστήριξης.\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Στρατηγικός Σχεδιασμός & Διοίκηση\"},{\"kind\":\"li\",\"text\":\"Συμμετοχή στη διαμόρφωση και υλοποίηση της στρατηγικής ανάπτυξης της εταιρείας.\"},{\"kind\":\"li\",\"text\":\"Μετατροπή των στρατηγικών στόχων σε επιχειρησιακά πλάνα δράσης.\"},{\"kind\":\"li\",\"text\":\"Παρακολούθηση της επίτευξης των εταιρικών στόχων και λήψη διορθωτικών ενεργειών όπου απαιτείται.\"},{\"kind\":\"li\",\"text\":\"Υποβολή περιοδικών αναφορών προς τη Διοίκηση σχετικά με την επιχειρησιακή απόδοση.\"},{\"kind\":\"li\",\"text\":\"Διοίκηση Επιχειρησιακών Λειτουργιών\"},{\"kind\":\"li\",\"text\":\"Συντονισμός και εποπτεία της καθημερινής λειτουργίας όλων των επιχειρησιακών τμημάτων.\"},{\"kind\":\"li\",\"text\":\"Διασφάλιση της αποτελεσματικότητας των διαδικασιών και της βέλτιστης αξιοποίησης των διαθέσιμων πόρων.\"},{\"kind\":\"li\",\"text\":\"Ανάπτυξη, εφαρμογή και αναθεώρηση πολιτικών, διαδικασιών και προτύπων λειτουργίας.\"},{\"kind\":\"li\",\"text\":\"Διαχείριση έργων οργανωτικού μετασχηματισμού και βελτιστοποίησης λειτουργιών.\"},{\"kind\":\"li\",\"text\":\"Οικονομική Διαχείριση & Έλεγχος\"},{\"kind\":\"li\",\"text\":\"Παρακολούθηση των λειτουργικών προϋπολογισμών και του κόστους λειτουργίας.\"},{\"kind\":\"li\",\"text\":\"Ανάλυση δεικτών απόδοσης (KPIs) και υποβολή προτάσεων βελτίωσης.\"},{\"kind\":\"li\",\"text\":\"Συνεργασία με το Οικονομικό Τμήμα για την αποτελεσματική διαχείριση των οικονομικών πόρων.\"},{\"kind\":\"li\",\"text\":\"Διασφάλιση της τήρησης των εγκεκριμένων προϋπολογισμών και των οικονομικών στόχων.\"},{\"kind\":\"li\",\"text\":\"Διαχείριση Ανθρώπινου Δυναμικού\"},{\"kind\":\"li\",\"text\":\"Ηγεσία και ανάπτυξη των διευθυντικών στελεχών και των ομάδων εργασίας.\"},{\"kind\":\"li\",\"text\":\"Καθορισμός στόχων απόδοσης και αξιολόγηση των αποτελεσμάτων.\"},{\"kind\":\"li\",\"text\":\"Προώθηση κουλτούρας συνεργασίας, καινοτομίας και συνεχούς βελτίωσης.\"},{\"kind\":\"li\",\"text\":\"Συμμετοχή στη στελέχωση και την ανάπτυξη του ανθρώπινου δυναμικού σε συνεργασία με το HR.\"},{\"kind\":\"li\",\"text\":\"Διαχείριση Ποιότητας & Συμμόρφωσης\"},{\"kind\":\"li\",\"text\":\"Διασφάλιση της συμμόρφωσης με την ισχύουσα νομοθεσία, τις εσωτερικές πολιτικές και τα πρότυπα ποιότητας.\"},{\"kind\":\"li\",\"text\":\"Εποπτεία συστημάτων εσωτερικού ελέγχου και διαχείρισης κινδύνων.\"},{\"kind\":\"li\",\"text\":\"Συντονισμός ενεργειών που αφορούν πιστοποιήσεις, ελέγχους και κανονιστικές απαιτήσεις.\"},{\"kind\":\"li\",\"text\":\"Reporting & KPIs\"},{\"kind\":\"li\",\"text\":\"Παρακολούθηση και αξιολόγηση βασικών δεικτών απόδοσης (Operational KPIs).\"},{\"kind\":\"li\",\"text\":\"Προετοιμασία μηνιαίων και τριμηνιαίων αναφορών προς τη Διοίκηση.\"},{\"kind\":\"li\",\"text\":\"Ανάλυση αποκλίσεων και εισήγηση διορθωτικών ενεργειών για τη βελτίωση της παραγωγικότητας και της κερδοφορίας.\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με Γενικό Διευθυντή\"},{\"kind\":\"li\",\"text\":\"Επικοινωνεί και συνεργάζεται καθημερινά με το γενικό διευθυντή για τρέχοντα θέματα εργασιών\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει σε συνεργασία με τον Γ.Δ. & Δ/ντη Παραγωγής και τους τομεάρχες το πλάνο και τη ροή εργασιών\"},{\"kind\":\"li\",\"text\":\"Παρέχει έγκυρες και εντός χρονικών ορίων πληροφορίες για θέματα μείζονος σημασίας\"},{\"kind\":\"h\",\"text\":\"Συνεργασία με τμήματα\"},{\"kind\":\"li\",\"text\":\"Συμμετέχει σε θεσμοθετημένες τμηματικές και διατμηματικές συσκέψεις διατηρώντας ουσιαστικό και κρίσιμο ρόλο\"},{\"kind\":\"li\",\"text\":\"Συνεργάζεται καθημερινά με τους προϊσταμένους τμημάτων (π.χ. τεχνικό, προμηθειών, εφοδιαστικής αλυσίδας κτλ. για όλη την γκάμα θεμάτων που αφορούν τις παραγγελίες υλοποίησης παραγωγής)\"},{\"kind\":\"h\",\"text\":\"Δεξιότητες, ικανότητες, γνώσεις και προφίλ που απαιτεί ο ρόλος\"},{\"kind\":\"li\",\"text\":\"Ισχυρές επικοινωνιακές δεξιότητες σε επίπεδο ανώτατης διοίκησης\"},{\"kind\":\"li\",\"text\":\"Στρατηγική σκέψη και κριτική ικανότητα\"},{\"kind\":\"li\",\"text\":\"Λήψη αποφάσεων υπό πίεση χρόνου και πολυπλοκότητας\"},{\"kind\":\"li\",\"text\":\"Ικανότητα διοίκησης ανθρώπων και ανάπτυξης διευθυντικών στελεχών (Ηγεσία)\"},{\"kind\":\"li\",\"text\":\"Διαχείριση αλλαγής και οργανωτικού μετασχηματισμού\"},{\"kind\":\"li\",\"text\":\"Ανάλυση δεικτών απόδοσης (KPIs) και μετουσίωση δεδομένων Business Intelligence σε ουσιαστική πληροφόρηση διοίκησης\"},{\"kind\":\"li\",\"text\":\"Οργάνωση και συντονισμός πολλαπλών, ταυτόχρονων επιχειρησιακών λειτουργιών\"},{\"kind\":\"li\",\"text\":\"Γνώση αρχών διοίκησης επιχειρησιακών λειτουργιών και συντονισμού πολλαπλών τμημάτων\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση χρηματοοικονομικής ανάλυσης, κατάρτισης και παρακολούθησης προϋπολογισμών\"},{\"kind\":\"li\",\"text\":\"Γνώση μεθοδολογιών διαχείρισης έργων και οργανωτικού μετασχηματισμού\"},{\"kind\":\"li\",\"text\":\"Γνώση αρχών διαχείρισης ανθρώπινου δυναμικού\"},{\"kind\":\"li\",\"text\":\"Προσήλωση στην ποιότητα και τη συμμόρφωση\"},{\"kind\":\"li\",\"text\":\"Συνέπεια και υπευθυνότητα στην τήρηση δεσμεύσεων προς τη Γενική Διεύθυνση\"},{\"kind\":\"li\",\"text\":\"Συνεργασία με προϊσταμένους τμημάτων\"},{\"kind\":\"li\",\"text\":\"Ανεπτυγμένη εμπορική/επιχειρηματική αντίληψη\"},{\"kind\":\"h\",\"text\":\"Ενδεικτικές αναφορές που συντάσσει/αποδέχεται (reports)\"},{\"kind\":\"table\",\"head\":[\"Αναφορές που συντάσσει\"],\"body\":[[\"Θέμα\",\"Από\",\"Προς\",\"Συχνότητα\"],[\"Συνολική αναφορά λειτουργικής απόδοσης (Προμήθειες, Αποθήκη, IT, Διοίκηση, HR)\",\"Operations Director\",\"Γενική Διεύθυνση\",\"Μηνιαία\"],[\"Προϋπολογισμός λειτουργιών\",\"Operations Director\",\"Γενική Διεύθυνση\",\"3μηνιαία\"],[\"Στρατηγικό πλάνο βελτίωσης λειτουργιών\",\"Operations Director\",\"Γενική Διεύθυνση\",\"Ετήσια\"]]},{\"kind\":\"table\",\"head\":[\"Αναφορές που δέχεται\"],\"body\":[[\"Κατάσταση αποθεμάτων και αναγκών αναπλήρωσης\",\"Head of Warehouse & Logistics\",\"Operations Director\",\"Τακτικά\"],[\"Οικονομική κατάσταση και ταμειακή ρευστότητα\",\"Finance Manager\",\"Operations Director\",\"Τακτικά\"],[\"Κατάσταση προσωπικού και ζητήματα Ανθρώπινου Δυναμικού\",\"HR Manager\",\"Operations Director\",\"Τακτικά\"],[\"Αναφορά λειτουργίας διοικητικών υπηρεσιών\",\"Head of Administration\",\"Operations Director\",\"Τακτικά\"]]},{\"kind\":\"h\",\"text\":\"Ενδεικτικές συσκέψεις (meetings) που συμμετέχει\"},{\"kind\":\"table\",\"head\":[\"Τίτλος\",\"Συμμετέχοντες\",\"Συχνότητα\",\"Περιεχόμενο\"],\"body\":[[\"Σύσκεψη Συντονισμού Λειτουργιών\",\"Operations Director, Purchasing Manager, Head of Warehouse & Logistics, Head of Administration, IT Manager & Automation\",\"Εβδομαδιαία\",\"Συντονισμός καθημερινών λειτουργιών\"],[\"Σύσκεψη Ανασκόπησης Δεικτών Λειτουργιών\",\"Operations Director, Finance Manager\",\"Μηνιαία\",\"Σύγκριση πραγματικών οικονομικών αποτελεσμάτων λειτουργιών με τον εγκεκριμένο προϋπολογισμό\"]]},{\"kind\":\"h\",\"text\":\"Χρήση συστημάτων\"},{\"kind\":\"li\",\"text\":\"Συνολική εποπτεία δεδομένων και KPIs σε όλες τις λειτουργείες (ERP)\"},{\"kind\":\"li\",\"text\":\"Εργαλεία αναφορών/Business Intelligence για ενοποιημένη εικόνα απόδοσης λειτουργιών\"},{\"kind\":\"li\",\"text\":\"MS Office (word, excel, PowerPoint, outlook)\"},{\"kind\":\"h\",\"text\":\"Τυπικά προσόντα θέσης\"},{\"kind\":\"li\",\"text\":\"Πτυχίο Ανώτατης Εκπαίδευσης στη Διοίκηση Επιχειρήσεων, Οικονομικά ή συναφές αντικείμενο.\"},{\"kind\":\"li\",\"text\":\"Μεταπτυχιακός τίτλος (MBA, MSC ή συναφής) θα θεωρηθεί επιπλέον προσόν.\"},{\"kind\":\"li\",\"text\":\"Αποδεδειγμένη εμπειρία σε ανώτερη διοικητική θέση επιχειρησιακής ευθύνης\"},{\"kind\":\"li\",\"text\":\"Ισχυρές ηγετικές, οργανωτικές και επικοινωνιακές δεξιότητες\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση διαχείρισης έργων, προϋπολογισμών και KPIs\"},{\"kind\":\"li\",\"text\":\"Ικανότητα μετουσίωσης δεδομένων Business Intelligence (BI) σε ουσιαστική Πληροφόρηση Διοίκησης (Management Information-MI) για την υποστήριξη στρατηγικών αποφάσεων προς την Γενική Διεύθυνση και το Διοικητικό Συμβούλιο\"},{\"kind\":\"li\",\"text\":\"Άριστη γνώση της ελληνικής και της αγγλικής γλώσσας\"},{\"kind\":\"h\",\"text\":\"Βασικοί Δείκτες Απόδοσης (KPIs)\"},{\"kind\":\"li\",\"text\":\"Λειτουργικό Κόστος vs Προϋπολογισμού (Cost Variance)\"},{\"kind\":\"li\",\"text\":\"Μεικτό Κέρδος / Κόστος Εργασίας, Προστιθέμενη Αξία ανά Κεφαλή\"},{\"kind\":\"li\",\"text\":\"Aπόκλιση Προϋπολογισμού Λειτουργιών (Budget vs. Actual)\"},{\"kind\":\"li\",\"text\":\"Ημέρες Πληρωμής Προμηθευτών (Days Payable Outstanding)\"},{\"kind\":\"li\",\"text\":\"Ρυθμός Κατανάλωσης Ρευστότητας (Burn Rate) / Διάρκεια Ζωής (Cash Runway)\"},{\"kind\":\"li\",\"text\":\"Ημέρες Είσπραξης (Days Sales Outstanding)\"},{\"kind\":\"li\",\"text\":\"Λειτουργικές Ταμειακές Ροές (Operating Cash Flow)\"},{\"kind\":\"li\",\"text\":\"Περιθώριο Λειτουργικού Κέρδους (Operating Profit Margin)\"},{\"kind\":\"li\",\"text\":\"Δείκτης Άμεσης Ρευστότητας (Quick Ratio)\"},{\"kind\":\"li\",\"text\":\"Απόδοση Ενεργητικού (Return on Assets)\"},{\"kind\":\"li\",\"text\":\"Δείκτης Κεφαλαίου Κίνησης (Working Capital Ratio)\"},{\"kind\":\"h\",\"text\":\"Προϋπηρεσία για τη θέση\"},{\"kind\":\"li\",\"text\":\"Εμπειρία 15 χρόνια σε τμήματα βιομηχανικής παραγωγής, εκ των οποίων 10 έτη σε προϊσταμενική θέση τομέα ποιότητας και ασφάλειας\"}],\"children\":[14,17,19,21,25,30],\"depth\":2},{\"id\":\"r14\",\"dept\":\"Διεύθυνση Λειτουργιών & Οικονομικών Υπηρεσιών\",\"title\":\"Οικονομικός Διευθυντής ή Υπεύθυνος Οικονομικού Τμήματος (Finance Manager)\",\"short\":\"Finance Manager\",\"reportsTo\":\"Διευθυντή Λειτουργιών\",\"parent\":13,\"virtual\":false,\"noPanel\":false,\"staffList\":[],\"blocks\":[{\"kind\":\"h\",\"text\":\"Σκοπος του ρολου\"},{\"kind\":\"p\",\"text\":\"Η αποτίμηση των πόρων της εταιρείας και η αποτελεσματική διαχείριση των χρηματοοικονομικών παραμέτρων\"},{\"kind\":\"h\",\"text\":\"Θέσεις που αναφέρονται στην παρούσα θέση\"},{\"kind\":\"p\",\"text\":\"Πιστωτικός έλεγχος, προϊστάμενος λογιστηρίου, υπεύθυνοι μηχανογράφησης, ελέγχου προμηθειών\"},{\"kind\":\"h\",\"text\":\"Κύρια Καθήκοντα – Δραστηριότητες\"},{\"kind\":\"li\",\"text\":\"Καταρτίζει τις οικονομικές αναφορές και καταστάσεις\"},{\"kind\":\"li\",\"text\":\"Ελέγχει τις ταμιακές ροές\"},{\"kind\":\"li\",\"text\":\"Ελέγχει θέματα κόστους, εξόδων και αποδοτικότητας της εταιρείας\"},{\"kind\":\"li\",\"text\":
